name: Deploy CatchLogX

# INTERIM, MANUAL production deploy (#142 -> #143).
#
# This is the deploy path for the window between the immutable-release topology
# (#143) and the gated pipeline (#144). It ships a deliberately chosen `master`
# commit to Martin's BOKU machine through that machine's own self-hosted runner
# (there is no SSH or tunnel access by decision, #115). It is DELETED together
# with this workflow once #143 and #144 have landed.
#
# Topology on the machine since #143:
#   * the app is a systemd USER unit (`catchlogx.service` -> `node
#     ~/current/server.js`), NOT a container - provisioned by the
#     `release-topology` job of production-maintenance.yml;
#   * a deploy BUILDS ONCE here (native glibc Node, matching the runtime - never
#     an alpine container build, whose musl bcrypt/Prisma binaries would not run
#     on the host's glibc node), publishes `~/releases/<sha>/`, atomically swaps
#     `~/current`, and restarts the unit. No build happens on restart;
#   * a rollback re-dispatches this same workflow with the previous `master`
#     commit; the previous release may still be on disk, but re-publishing is
#     the deterministic path.
#
# It is `workflow_dispatch` ONLY. The push trigger is deliberately absent until
# #144 restores it. Safety properties, in order:
#   * the requested ref must be reachable from `master` - only master commits
#     may reach production;
#   * the ADOPTED-SCHEMA GUARD runs as the first thing that touches the machine:
#     it refuses to deploy while production is still on the legacy `prisma db
#     push` schema;
#   * the runtime env file must exist (created by #143's `release-topology`);
#   * the interim app container, if it still exists, is retired right before the
#     unit starts, so exactly one process owns port 3001.
#
# Rollback: re-dispatch this workflow with `ref` set to the previous master
# commit:
#   gh workflow run production-deploy.yml --ref master -f ref=<previous-master-commit>
# The same recipe is printed in the job summary and documented in
# docs/ai/ARCHITECTURE.md.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "master commit/branch/tag to deploy"
        required: true
        default: "master"
        type: string

concurrency:
  group: prod-deploy
  cancel-in-progress: false

env:
  ENV_FILE: /opt/CatchLogX/.env
  APP_CONTAINER: clx-web
  PG_CONTAINER: clx-postgres
  PG_USER: clxadmin
  PG_DB: clx
  UNIT_NAME: catchlogx.service

jobs:
  deploy:
    name: Deploy to production (BOKU)
    runs-on: [self-hosted, boku]

    steps:
      # The runner is a SYSTEM service with no logind session: point it at the
      # user systemd manager (linger is enabled by the release-topology job,
      # #143) and refuse early if it is not reachable.
      - name: Point at the user systemd manager
        run: |
          set -euo pipefail
          RUNDIR="/run/user/$(id -u)"
          echo "XDG_RUNTIME_DIR=$RUNDIR" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$RUNDIR/bus" >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR="$RUNDIR"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$RUNDIR/bus"
          case "$(systemctl --user is-system-running 2>/dev/null || true)" in
            running|degraded) echo "User systemd manager reachable." ;;
            *)
              echo "::error::no systemd user manager - run the release-topology job (#143) first (or 'sudo loginctl enable-linger $(id -un)' on-site)"
              exit 1
              ;;
          esac

      - name: Check out the requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      # Only a commit that is reachable from origin/master may reach
      # production. An older master commit is allowed on purpose - that is the
      # rollback path.
      - name: Resolve and verify the deploy commit
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          git fetch origin master
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "::error::ref '$REQUESTED_REF' ($(git rev-parse --short HEAD)) is not reachable from origin/master - only master commits may reach production"
            exit 1
          fi
          SHA="$(git rev-parse HEAD)"
          echo "DEPLOY_SHA=$SHA" >> "$GITHUB_ENV"
          echo "Deploying commit $SHA (requested ref: $REQUESTED_REF)"

      # Same major as the runtime node installed by #143's release-topology
      # (`~/tools/node-v22...`). Build and runtime MUST share the platform.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      # The FIRST thing that touches the machine. Refuse to deploy unless
      # production is already on the adopted, migration-tracked schema: on the
      # db-push era database there is no `_prisma_migrations` table and
      # `prisma migrate deploy` would collide with the existing tables.
      - name: Adopted-schema guard
        env:
          FALLBACK_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          docker inspect "$PG_CONTAINER" >/dev/null || { echo "::error::$PG_CONTAINER not found - is production running?"; exit 1; }

          # The on-machine env file is the source of truth since #143; fall back
          # to the running container, then to the secret.
          if [ -f "$ENV_FILE" ]; then
            URL="$(grep -E '^DATABASE_URL=' "$ENV_FILE" | head -n1 | cut -d= -f2-)"
          fi
          if [ -z "${URL:-}" ] && docker inspect "$APP_CONTAINER" >/dev/null 2>&1; then
            URL="$(docker exec "$APP_CONTAINER" printenv DATABASE_URL)"
            URL="${URL/@db:5432/@127.0.0.1:5432}"
          fi
          if [ -z "${URL:-}" ]; then
            URL="$FALLBACK_URL"
          fi
          if [ -z "${URL:-}" ]; then
            echo "::error::could not determine the production database URL"
            exit 1
          fi
          echo "PROD_DATABASE_URL=$URL" >> "$GITHUB_ENV"

          # 1. the Prisma Migrate bookkeeping table must exist. On the db-push
          #    era database it never does - that is the legacy signal.
          HAS_TABLE="$(docker exec "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -Atc "SELECT to_regclass('public.\"_prisma_migrations\"') IS NOT NULL")"
          if [ "$HAS_TABLE" != "t" ]; then
            echo "::error::production is not on the adopted schema yet - run the cutover (#141) first"
            exit 1
          fi

          # 2. and the baseline must already be recorded as applied (that is the
          #    adopted signal), with no half-applied migration left behind. A
          #    ref that itself adds a migration is NOT refused here - applying
          #    it is exactly what this deploy is for (step "Apply pending
          #    migrations" below runs `migrate deploy`).
          ADOPTED="$(docker exec "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -Atc \
            "SELECT count(*) FROM \"_prisma_migrations\" WHERE migration_name = '20261017190000_init' AND finished_at IS NOT NULL")"
          INCOMPLETE="$(docker exec "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -Atc \
            "SELECT count(*) FROM \"_prisma_migrations\" WHERE finished_at IS NULL AND rolled_back_at IS NULL")"
          if [ "$ADOPTED" != "1" ]; then
            echo "::error::production is not on the adopted schema yet - run the cutover (#141) first"
            exit 1
          fi
          if [ "$INCOMPLETE" != "0" ]; then
            echo "::error::$INCOMPLETE migration(s) are half-applied on production - refusing to deploy"
            exit 1
          fi
          echo "Production is on the adopted, migration-tracked schema (baseline recorded)."

      # `next build` inlines NEXT_PUBLIC_* and needs the app's env, exactly as
      # the dev-instance deploy does. The env file lives on the machine (#143).
      - name: Provide the runtime environment to the build
        run: |
          set -euo pipefail
          if [ ! -f "$ENV_FILE" ]; then
            echo "::error::$ENV_FILE is missing - run the release-topology job (#143) first"
            exit 1
          fi
          cp "$ENV_FILE" .env
          echo "Copied $ENV_FILE into the workspace (mode $(stat -c%a "$ENV_FILE"))."

      - name: Build (standalone)
        run: npm run build

      # Apply pending migrations in the job, NOT in any container.
      - name: Apply pending migrations
        env:
          DATABASE_URL: ${{ env.PROD_DATABASE_URL }}
        run: npm run prisma:deploy

      # Publish the immutable release and atomically repoint ~/current (last
      # step of the script). The previous release stays on disk for a rollback.
      - name: Publish the release
        run: ./scripts/publish-release.sh "$DEPLOY_SHA"

      # The systemd unit owns the app and port 3001 from here. The interim
      # container (present until the first #143 deploy) must not race it.
      # Idempotent - absent on every deploy after the first.
      - name: Retire the interim app container
        run: |
          set -euo pipefail
          if docker inspect "$APP_CONTAINER" >/dev/null 2>&1; then
            docker update --restart=no "$APP_CONTAINER"
            docker stop "$APP_CONTAINER"
            docker rm "$APP_CONTAINER"
            echo "Removed $APP_CONTAINER - the systemd unit owns the app now."
          else
            echo "$APP_CONTAINER is already gone."
          fi

      - name: Restart the service
        run: systemctl --user restart "$UNIT_NAME"

      # The build already happened, so this only waits for `node` to bind. A
      # generous budget, but a failed unit is fail-fast.
      - name: Health check
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3001/; then
              echo "Production is healthy (attempt $attempt)."
              exit 0
            fi
            sleep 2
          done
          echo "::error::health check failed - $UNIT_NAME did not answer on 127.0.0.1:3001"
          systemctl --user --no-pager status "$UNIT_NAME" || true
          journalctl --user -u "$UNIT_NAME" -n 100 --no-pager || true
          exit 1

      # Report the deployed commit and the rollback recipe.
      - name: Report the deployed commit
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          {
            echo "### Deployed commit"
            echo ""
            echo "- \`$DEPLOY_SHA\` (requested ref: \`$REQUESTED_REF\`)"
            echo "- Release: \`$(readlink -f "$HOME/current" 2>/dev/null || echo '?')\`"
            echo "- Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "**Rollback:** re-dispatch this workflow with \`ref\` set to the previous master commit -"
            echo "the deploy is idempotent and re-runnable:"
            echo ""
            echo '```'
            echo "gh workflow run production-deploy.yml --ref master -f ref=<previous-master-commit>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed commit: $DEPLOY_SHA"

      # A failure after the restart leaves the unit down; the previous release
      # is still on disk, but re-publishing is the deterministic recovery.
      - name: Failure - report the state and the recovery
        if: failure()
        run: |
          set +e
          {
            echo "## Production deploy FAILED"
            echo ""
            echo "- Unit \`$UNIT_NAME\`: \`$(systemctl --user is-active "$UNIT_NAME" 2>/dev/null || echo unknown)\`"
            echo "- \`~/current\` -> \`$(readlink -f "$HOME/current" 2>/dev/null || echo '<none>')\`"
            echo "- Requested ref: \`${{ inputs.ref }}\`"
            echo ""
            echo "**Recovery:** re-dispatch this workflow with the previous master commit -"
            echo "that deploys the last known good code:"
            echo ""
            echo '```'
            echo "gh workflow run production-deploy.yml --ref master -f ref=<previous-master-commit>"
            echo '```'
            echo ""
            echo "Do not run the db-push-era code and do not hand-edit the schema: production"
            echo "is migration-tracked since the cutover (#141)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy failed - unit state: $(systemctl --user is-active "$UNIT_NAME" 2>/dev/null || echo unknown). Recovery: re-dispatch with the previous master commit."
