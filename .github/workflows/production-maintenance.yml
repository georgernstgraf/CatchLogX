name: Production maintenance

# Manual jobs that run ON the BOKU production machine, through its self-hosted
# runner. That runner is the only sanctioned path to production: there is no
# SSH or tunnel access by decision (#115).
#
# Safety rules for this workflow:
#   - workflow_dispatch only. It must never run on pull_request, so untrusted
#     fork code can never reach the self-hosted BOKU runner.
#   - This repository is public. Database dumps and MinIO exports stay on the
#     machine; only structural output (schema diff, row counts, migration
#     bookkeeping) may ever be uploaded as artifacts.
#   - The audit job is read-only: it never writes to the database and never
#     stops or restarts the app.
#
# Runner labelling: docs/ai/PITFALLS.md states that only master-triggered
# workflows may name the `boku` label. This workflow is the deliberate
# exception for the one-time migration window - it is dispatch-only, it takes
# write access to trigger, and the code it runs is reviewed on dev first
# (#138).
#
# Exactly five jobs in this repository may WRITE to production: `cutover`
# (#141), which retires the db-push-era app container, takes a fresh dump +
# MinIO export, runs the adoption script, verifies the result and brings up the
# migration-tracked stack; `smoke-user` (#150), which provisions the dedicated
# account that cutover's sign-in / file-download smoke test uses;
# `release-topology` (#143), which provisions the immutable-release runtime
# (pinned Node under ~/tools, the systemd user unit, the on-machine env file)
# without disrupting the running app; `readonly-role` (#152), which upserts
# the shared read-only statistics role and its password in the on-machine env
# file; and `db-observability` (#169), which writes PostgreSQL settings for
# query observability and restarts the database container once. Every job that
# mutates production is gated the same three ways:
#   - dispatch-only: it can never be reached by a push or a pull request;
#   - ref-guarded to `master`: it only runs for `--ref master`;
#   - armed by the typed confirmation input `confirm=ADOPT-PRODUCTION`.
# `db-report` (#169) is the read-only counterpart: it only SELECTs from the
# statistics views, writes no database row, and keeps the report (which
# contains query texts) on the machine.
# `cutover` must NOT be dispatched before the on-site maintenance appointment
# (#122) has been agreed with Martin: it stops the live app and takes production
# down by design, in one ordered run so the db-push-era app can never come back.

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Which maintenance job to run"
        type: choice
        options:
          - audit
          - rehearse
          - machine-report
          - smoke-user
          - cutover
          - release-topology
          - readonly-role
          - db-observability
          - db-report
          - all
        default: audit
      confirm:
        description: "Type ADOPT-PRODUCTION to arm a job that writes to production (cutover, smoke-user, release-topology, readonly-role, db-observability; ignored by the read-only jobs)"
        required: true
        default: ""
        type: string
      keep_backups:
        description: "Backup sets to retain on the machine"
        required: true
        default: "5"
        type: string

concurrency:
  group: prod-maintenance
  cancel-in-progress: false

env:
  PG_CONTAINER: clx-postgres
  MINIO_CONTAINER: clx-minio
  PG_USER: clxadmin
  PG_DB: clx
  MINIO_BUCKET: catchlogx-files
  # Credentials default to the values the db-push-era compose shipped with;
  # set the secrets when #122 rotates them.
  MC_USER: ${{ secrets.PROD_MINIO_USER || 'minioadmin' }}
  MC_PASS: ${{ secrets.PROD_MINIO_PASSWORD || 'minioadmin' }}
  BACKUP_ROOT: ${{ vars.PROD_BACKUP_DIR || 'catchlogx-backups' }}
  APP_CONTAINER: clx-web

jobs:
  audit:
    name: Audit and back up production
    if: inputs.job == 'audit' || inputs.job == 'all'
    runs-on: [self-hosted, boku]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preconditions
        run: |
          set -euo pipefail
          docker inspect "$PG_CONTAINER" >/dev/null
          docker inspect "$MINIO_CONTAINER" >/dev/null
          echo "Both production containers are running."

      - name: Back up the database
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          DEST="$HOME/$BACKUP_ROOT/$STAMP"
          mkdir -p "$DEST"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          echo "DEST=$DEST" >> "$GITHUB_ENV"

          # Local socket inside the container: the official postgres image
          # trusts local connections, so no password is involved here.
          docker exec "$PG_CONTAINER" pg_dump -U "$PG_USER" -d "$PG_DB" -Fc > "$DEST/db.dump"

          # Never trust an archive we have not listed.
          docker run --rm -v "$DEST:/backup:ro" postgres:16-alpine \
            pg_restore --list /backup/db.dump > "$DEST/db.dump.list"
          test -s "$DEST/db.dump.list"

          echo "Database dump verified: $(du -h "$DEST/db.dump" | cut -f1)"

      - name: Export the MinIO bucket
        run: |
          set -euo pipefail
          # Discover the container's network instead of guessing the compose
          # project name.
          NET="$(docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{"\n"}}{{end}}' "$MINIO_CONTAINER" | head -n1)"
          # Run as the runner user so the exported files are not root-owned
          # (otherwise backup pruning cannot remove them later).
          MC_HOME="$(mktemp -d)"
          docker run --rm --network "$NET" --user "$(id -u):$(id -g)" \
            -v "$DEST:/backup" -v "$MC_HOME:/mc-home" -e HOME=/mc-home \
            -e "MC_HOST_prod=http://${MC_USER}:${MC_PASS}@${MINIO_CONTAINER}:9000" \
            minio/mc:latest \
            mirror --overwrite "prod/${MINIO_BUCKET}" /backup/minio
          rm -rf "$MC_HOME"
          echo "Exported $(find "$DEST/minio" -type f | wc -l) objects ($(du -sh "$DEST/minio" | cut -f1))."

      # The production bucket is expected to hold the 18 uploads and the
      # template file referenced by the database. Locate the bytes (or prove
      # they are gone) before the adoption script (#139) depends on them.
      - name: Storage diagnostics
        run: |
          set -euo pipefail
          NET="$(docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{"\n"}}{{end}}' "$MINIO_CONTAINER" | head -n1)"
          mc() {
            # The minio/mc image already uses `mc` as its entrypoint - do not
            # prefix the arguments with a second `mc`.
            docker run --rm --network "$NET" \
              -e "MC_HOST_prod=http://${MC_USER}:${MC_PASS}@${MINIO_CONTAINER}:9000" \
              minio/mc:latest "$@"
          }

          echo "=== buckets visible via mc ==="
          mc ls prod/ || echo "(mc ls failed)"

          echo "=== recursive listing of ${MINIO_BUCKET} (first 20) ==="
          mc ls --recursive "prod/${MINIO_BUCKET}" 2>&1 | head -n 20 || true
          echo "object count: $(mc ls --recursive "prod/${MINIO_BUCKET}" 2>/dev/null | wc -l)"

          echo "=== minio container mounts ==="
          docker inspect -f '{{range .Mounts}}{{.Type}} {{if .Name}}{{.Name}}{{else}}{{.Source}}{{end}} -> {{.Destination}}{{"\n"}}{{end}}' "$MINIO_CONTAINER"

          echo "=== raw contents of every minio volume ==="
          for v in $(docker volume ls --format '{{.Name}}' | grep -i minio); do
            echo "--- volume: $v ---"
            docker run --rm -v "$v:/data:ro" alpine sh -c '
              echo "top level:"; ls -A /data | head -n 20
              echo "bucket directories:"; find /data -mindepth 1 -maxdepth 1 -type d -not -name ".minio.sys" | head -n 20
              echo "size by top-level entry:"; du -sh /data/* 2>/dev/null | sort -h | tail -n 10
              echo "object metadata (xl.meta) outside .minio.sys: $(find /data -name xl.meta -not -path "*/.minio.sys/*" | wc -l)"
            '
          done

          echo "=== minio server log (last 30 lines) ==="
          docker logs --tail 30 "$MINIO_CONTAINER" 2>&1 || true

          echo "=== mc admin info ==="
          mc admin info prod 2>&1 || echo "(unavailable)"

          echo "=== all containers ==="
          docker ps -a --format '{{.Names}} | {{.Image}} | {{.Status}} | {{.Ports}}'

          echo "=== containers attached to the app network ==="
          docker network inspect "$NET" --format '{{range .Containers}}{{.Name}} {{.IPv4Address}}{{"\n"}}{{end}}' 2>&1 || true

          echo "=== how the app resolves its storage endpoint ==="
          docker exec "$APP_CONTAINER" getent hosts "$(docker exec "$APP_CONTAINER" printenv MINIO_ENDPOINT 2>/dev/null || echo minio)" 2>&1 || true

          echo "=== on-disk layout of the bucket (structure and sizes, names masked) ==="
          docker run --rm -v "catchlogx_clx_miniodata:/data:ro" alpine sh -c '
            echo "bucket tree (depth 3, names masked):"
            find /data/catchlogx-files -maxdepth 3 | sed -E "s#/data/catchlogx-files/?##; s#[^/]{25,}#<name>#g" | head -n 40
            echo "object directories: $(find /data/catchlogx-files -name xl.meta | wc -l)"
            echo "part files (data for large objects): $(find /data/catchlogx-files -name "part.*" | wc -l)"
            echo "largest 10 files:"
            find /data/catchlogx-files -type f -printf "%s %p\n" 2>/dev/null | sort -rn | head -n 10 | sed -E "s#[^ ]{25,}#<name>#g"
          ' 2>&1 || true

          echo "=== app container storage configuration ==="
          docker exec "$APP_CONTAINER" sh -c 'printenv' | grep -iE '^(MINIO|UPLOAD|STORAGE)' | sed 's/\(SECRET\|KEY\)=.*/\1=<redacted>/I' || echo "(none)"

          echo "=== database path shape (no file names) ==="
          docker exec -i "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -A -t -F'|' <<'SQL'
          SELECT 'Uploads_links', count(*), coalesce(min(length("link")),0) FROM "Uploads"
          UNION ALL SELECT 'DummyFiles_paths', count(*), coalesce(min(length("filePath")),0) FROM "DummyFiles";
          SELECT 'uploads_with_CatchLogX_prefix', count(*) FROM "Uploads" WHERE "link" LIKE 'CatchLogX/%';
          SELECT 'dummyfiles_with_CatchLogX_prefix', count(*) FROM "DummyFiles" WHERE "filePath" LIKE 'CatchLogX/%';
          SELECT 'Uploads shape', array_length(string_to_array("link", '/'), 1), split_part("link", '/', 1), split_part("link", '/', 2) FROM "Uploads" LIMIT 3;
          SELECT 'DummyFiles shape', array_length(string_to_array("filePath", '/'), 1), split_part("filePath", '/', 1), split_part("filePath", '/', 2) FROM "DummyFiles" LIMIT 3;
          SQL

      - name: Prune old backups
        run: |
          set -euo pipefail
          KEEP="${{ inputs.keep_backups }}"
          case "$KEEP" in ''|*[!0-9]*) echo "::error::keep_backups must be a number"; exit 1;; esac
          # Files written by container runs of older iterations can be
          # root-owned; clear them through a container before removing the set.
          remove_tree() {
            docker run --rm -v "$1:/x" alpine sh -c 'rm -rf /x/* /x/.[!.]* 2>/dev/null || true' >/dev/null 2>&1 || true
            rm -rf "$1" || true
          }
          ls -1dt "$HOME/$BACKUP_ROOT"/*/ 2>/dev/null | tail -n "+$((KEEP + 1))" | while read -r old; do remove_tree "$old"; done
          echo "Retained backup sets:"
          ls -1dt "$HOME/$BACKUP_ROOT"/*/

      # The running app container is the source of truth for the connection
      # string - no guessed or hardcoded credentials. Inside the container the
      # database is reached as `db`; from the runner host it is published on
      # loopback.
      - name: Resolve the production database URL
        run: |
          set -euo pipefail
          if docker inspect "$APP_CONTAINER" >/dev/null 2>&1; then
            URL="$(docker exec "$APP_CONTAINER" printenv DATABASE_URL)"
            URL="${URL/@db:5432/@127.0.0.1:5432}"
          else
            URL="${{ secrets.PROD_DATABASE_URL }}"
          fi
          if [ -z "$URL" ]; then
            echo "::error::Could not determine the production database URL"
            exit 1
          fi
          echo "PROD_DATABASE_URL=$URL" >> "$GITHUB_ENV"
          echo "Resolved the database URL from $APP_CONTAINER."

      - name: Schema drift report
        run: |
          set -euo pipefail
          npx prisma migrate diff \
            --from-url "$PROD_DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --script > drift.sql
          if grep -q 'This is an empty migration' drift.sql; then
            echo "Database matches schema.prisma - no drift."
          else
            echo "::warning::Schema drift detected; see drift.sql"
          fi

      - name: Row counts
        run: |
          set -euo pipefail
          docker exec -i "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -A -t -F'|' <<'SQL' > row-counts.txt
          SELECT format('SELECT %L, count(*) FROM %I.%I;', n.nspname||'.'||c.relname, n.nspname, c.relname)
          FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
          WHERE c.relkind = 'r' AND n.nspname = 'public'
          ORDER BY 1 \gexec
          SQL
          cat row-counts.txt

      - name: Migration bookkeeping
        run: |
          set -euo pipefail
          {
            echo "# _prisma_migrations"
            if [ -z "$(docker exec "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -Atc "SELECT to_regclass('public.\"_prisma_migrations\"')")" ]; then
              echo "ABSENT - this database has never been tracked by Prisma Migrate (db push era)."
            else
              docker exec "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -c \
                'SELECT migration_name, started_at, finished_at, rolled_back_at, applied_steps_count FROM "_prisma_migrations" ORDER BY started_at;'
            fi
          } > migration-state.txt
          cat migration-state.txt

      - name: Summary
        if: always()
        run: |
          {
            echo "## Production audit"
            echo ""
            echo "- Backup set: \`$DEST\`"
            echo "- Database dump: $(du -h "$DEST/db.dump" 2>/dev/null | cut -f1)"
            echo "- MinIO export: $(find "$DEST/minio" -type f 2>/dev/null | wc -l) objects, $(du -sh "$DEST/minio" 2>/dev/null | cut -f1)"
            echo ""
            echo "### Migration bookkeeping"
            echo '```'
            cat migration-state.txt 2>/dev/null
            echo '```'
            echo ""
            echo "### Schema drift (legacy database -> schema.prisma)"
            echo '```sql'
            head -n 80 drift.sql 2>/dev/null
            echo '```'
            echo ""
            echo "### Row counts"
            echo '```'
            cat row-counts.txt 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Structural reports only - never the dump or the MinIO export.
      - name: Upload structural reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-audit-${{ env.STAMP || github.run_id }}
          path: |
            drift.sql
            row-counts.txt
            migration-state.txt
          retention-days: 30
          if-no-files-found: warn

  # Rehearsal for the one-time cutover (#140): copy the production database,
  # run the adoption script against the copy with the real MinIO export, then
  # repeat, verify and throw the copy away. Production is never written to.
  rehearse:
    name: Rehearse the adoption against a copy of production
    if: inputs.job == 'rehearse' || inputs.job == 'all'
    runs-on: [self-hosted, boku]

    env:
      SCRATCH_DB: clx_rehearsal

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Resolve the production database URL
        run: |
          set -euo pipefail
          if docker inspect "$APP_CONTAINER" >/dev/null 2>&1; then
            URL="$(docker exec "$APP_CONTAINER" printenv DATABASE_URL)"
            URL="${URL/@db:5432/@127.0.0.1:5432}"
          else
            URL="${{ secrets.PROD_DATABASE_URL }}"
          fi
          if [ -z "$URL" ]; then
            echo "::error::Could not determine the production database URL"
            exit 1
          fi
          echo "PROD_DATABASE_URL=$URL" >> "$GITHUB_ENV"
          # Same server, separate database for the rehearsal. Strip the query
          # first - a glob-style ${URL/clx?/...} would match inside the user name.
          BASE="${URL%%\?*}"
          echo "SCRATCH_URL=${BASE%/*}/$SCRATCH_DB?schema=public" >> "$GITHUB_ENV"
          echo "Resolved the database URL from $APP_CONTAINER."

      - name: Export the MinIO bucket
        run: |
          set -euo pipefail
          EXPORT="$HOME/clx-rehearsal-export"
          # Leftovers from an earlier run may be root-owned - clear them first.
          if [ -e "$EXPORT" ]; then
            docker run --rm -v "$EXPORT:/x" alpine sh -c 'rm -rf /x/* /x/.[!.]* 2>/dev/null || true' >/dev/null 2>&1 || true
          fi
          rm -rf "$EXPORT" && mkdir -p "$EXPORT"
          echo "EXPORT=$EXPORT" >> "$GITHUB_ENV"
          NET="$(docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{"\n"}}{{end}}' "$MINIO_CONTAINER" | head -n1)"
          MC_HOME="$(mktemp -d)"
          docker run --rm --network "$NET" --user "$(id -u):$(id -g)" \
            -v "$EXPORT:/backup" -v "$MC_HOME:/mc-home" -e HOME=/mc-home \
            -e "MC_HOST_prod=http://${MC_USER}:${MC_PASS}@${MINIO_CONTAINER}:9000" \
            minio/mc:latest mirror --overwrite "prod/${MINIO_BUCKET}" /backup
          rm -rf "$MC_HOME"
          echo "Exported $(find "$EXPORT" -type f | wc -l) objects ($(du -sh "$EXPORT" | cut -f1))."

      - name: Copy the production database to the scratch database
        run: |
          set -euo pipefail
          docker exec "$PG_CONTAINER" psql -U "$PG_USER" -d postgres -q -c "DROP DATABASE IF EXISTS $SCRATCH_DB;"
          docker exec "$PG_CONTAINER" psql -U "$PG_USER" -d postgres -q -c "CREATE DATABASE $SCRATCH_DB;"
          docker exec "$PG_CONTAINER" pg_dump -U "$PG_USER" -d "$PG_DB" \
            | docker exec -i "$PG_CONTAINER" psql -U "$PG_USER" -d "$SCRATCH_DB" -q
          echo "Copied $PG_DB to $SCRATCH_DB."

      # Row counts must survive the adoption unchanged.
      - name: Row counts before
        run: |
          set -euo pipefail
          counts() {
            docker exec -i "$PG_CONTAINER" psql -U "$PG_USER" -d "$1" -A -t -F'|' <<'SQL'
          SELECT format('SELECT %L, count(*) FROM %I.%I;', n.nspname||'.'||c.relname, n.nspname, c.relname)
          FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
          WHERE c.relkind = 'r' AND n.nspname = 'public'
          ORDER BY 1 \gexec
          SQL
          }
          counts "$SCRATCH_DB" | sed 's/^public\.DummyFiles/public.TemplateFiles/' | grep -v _prisma_migrations | sort > counts-before.txt
          cat counts-before.txt

      - name: Rehearsal (dry run)
        run: |
          set -euo pipefail
          DATABASE_URL="$SCRATCH_URL" npx tsx scripts/adopt-legacy-prod.ts --source-dir "$EXPORT" --dry-run

      - name: Rehearsal (apply)
        run: |
          set -euo pipefail
          DATABASE_URL="$SCRATCH_URL" npx tsx scripts/adopt-legacy-prod.ts --source-dir "$EXPORT"

      - name: Rehearsal (second run must be a no-op)
        run: |
          set -euo pipefail
          OUTPUT="$(DATABASE_URL="$SCRATCH_URL" npx tsx scripts/adopt-legacy-prod.ts --source-dir "$EXPORT")"
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "write 0 blob(s)" || { echo "::error::second run was not a no-op"; exit 1; }

      # The same bookkeeping the cutover will perform: mark the history as
      # applied, then prove that migrate deploy is a no-op and the schema
      # matches schema.prisma exactly.
      - name: Migration bookkeeping and drift check
        env:
          DATABASE_URL: ${{ env.SCRATCH_URL }}
        run: |
          set -euo pipefail
          npx prisma migrate resolve --applied 20261017190000_init
          npx prisma migrate resolve --applied 20261017200000_replace_minio_with_file_blobs
          npx prisma migrate status
          npx prisma migrate deploy
          npx prisma migrate diff \
            --from-url "$SCRATCH_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --script > drift-after.sql
          if grep -q 'This is an empty migration' drift-after.sql; then
            echo "Schema matches schema.prisma exactly."
          else
            echo "::error::the adopted schema still differs from schema.prisma"
            cat drift-after.sql
            exit 1
          fi

      - name: Blob verification
        run: |
          set -euo pipefail
          docker exec -i "$PG_CONTAINER" psql -U "$PG_USER" -d "$SCRATCH_DB" -A -t -F'|' <<'SQL' | tee blob-report.txt
          SELECT 'blobs='||count(*)||' bytes='||coalesce(sum("sizeBytes"),0) FROM "FileBlob";
          SELECT 'uploads unlinked='||count(*) FROM "Uploads" WHERE "blobId" IS NULL;
          SELECT 'templates unlinked='||count(*) FROM "TemplateFiles" WHERE "blobId" IS NULL;
          SELECT 'uploads with mismatched size='||count(*) FROM "Uploads" u JOIN "FileBlob" b ON b.id = u."blobId" WHERE b."sizeBytes" <> length(b.data);
          SQL

      - name: Row counts after
        run: |
          set -euo pipefail
          docker exec -i "$PG_CONTAINER" psql -U "$PG_USER" -d "$SCRATCH_DB" -A -t -F'|' <<'SQL' | grep -v _prisma_migrations | grep -v "^public.FileBlob|" | sort > counts-after.txt
          SELECT format('SELECT %L, count(*) FROM %I.%I;', n.nspname||'.'||c.relname, n.nspname, c.relname)
          FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
          WHERE c.relkind = 'r' AND n.nspname = 'public'
          ORDER BY 1 \gexec
          SQL
          if diff -u counts-before.txt counts-after.txt > counts.diff; then
            echo "Row counts preserved by the adoption."
          else
            echo "::error::row counts changed during the adoption"
            cat counts.diff
            exit 1
          fi

      - name: Report
        if: always()
        run: |
          {
            echo "## Adoption rehearsal against a copy of production"
            echo ""
            echo "### Row counts (before vs. after)"
            echo '```'
            cat counts-before.txt 2>/dev/null || true
            echo '```'
            echo "### Blobs"
            echo '```'
            cat blob-report.txt 2>/dev/null || true
            echo '```'
            echo "### Remaining schema drift after adoption (must be empty)"
            echo '```sql'
            cat drift-after.sql 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload structural reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-rehearsal-${{ github.run_id }}
          path: |
            counts-before.txt
            counts-after.txt
            blob-report.txt
            drift-after.sql
          retention-days: 30
          if-no-files-found: warn

      - name: Drop the scratch database
        if: always()
        run: |
          docker exec "$PG_CONTAINER" psql -U "$PG_USER" -d postgres -q -c "DROP DATABASE IF EXISTS $SCRATCH_DB;" || true
          rm -rf "$HOME/clx-rehearsal-export" || true
          echo "Scratch database and export removed."

  # Read-only survey of the production machine (#143). It informs the
  # immutable-release topology BEFORE anything is provisioned: whether a native
  # Node runtime can run there, whether the runner's user has a systemd user
  # manager (and linger), where the runner checks out, and what still holds port
  # 3001. It writes nothing, stops nothing and needs no confirmation token.
  machine-report:
    name: Survey the production machine (#143)
    if: inputs.job == 'machine-report'
    runs-on: [self-hosted, boku]

    steps:
      # The runner is a SYSTEM service and therefore has no logind session: a
      # user systemd manager only exists with linger enabled, and even then
      # `systemctl --user` needs these two variables to find it.
      - name: Point at the user systemd manager
        run: |
          set -euo pipefail
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"

      - name: Survey
        run: |
          set +e
          {
            echo "## Production machine report (#143)"
            echo ""
            echo "### Host and user"
            echo '```'
            echo "host:   $(hostname)"
            echo "user:   $(id)"
            echo "HOME:   ${HOME}"
            echo "os:     $(. /etc/os-release 2>/dev/null && echo "$PRETTY_NAME")"
            echo "kernel: $(uname -sr)"
            echo "glibc:  $(ldd --version 2>&1 | head -n1)"
            echo "uptime: $(uptime -p 2>/dev/null)"
            echo "date:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo '```'
            echo ""
            echo "### Runner paths (this job's environment)"
            echo '```'
            echo "GITHUB_WORKSPACE:  ${GITHUB_WORKSPACE:-<unset>}"
            echo "RUNNER_WORKSPACE:  ${RUNNER_WORKSPACE:-<unset>}"
            echo "RUNNER_TOOL_CACHE: ${RUNNER_TOOL_CACHE:-<unset>}"
            echo '```'
            echo ""
            echo "### Node, npm and curl"
            echo '```'
            echo "node: $(command -v node || echo '<none>') $(node --version 2>&1)"
            echo "npm:  $(command -v npm || echo '<none>') $(npm --version 2>&1)"
            echo "curl: $(command -v curl || echo '<none>') $(curl --version 2>&1 | head -n1)"
            echo "~/tools: $(ls -d "$HOME"/tools 2>/dev/null || echo '<none>')"
            echo '```'
            echo ""
            echo "### systemd user manager (the #143 runtime)"
            echo '```'
            echo "XDG_RUNTIME_DIR:   ${XDG_RUNTIME_DIR:-<unset>}"
            echo "DBUS_SESSION_BUS:  ${DBUS_SESSION_BUS_ADDRESS:-<unset>}"
            echo "is-system-running: $(systemctl --user is-system-running 2>&1)"
            loginctl show-user "$(id -un)" 2>&1 | grep -iE '^(Linger|State)=' || echo "loginctl: <unavailable>"
            echo "user unit dir: $(ls -d "$HOME/.config/systemd/user" 2>/dev/null || echo '<none>')"
            echo "units matching clx/catchlogx:"
            systemctl --user list-units --all --no-pager 2>/dev/null | grep -iE 'clx|catchlogx' || echo "  (none)"
            echo '```'
            echo ""
            echo "### Releases and current"
            echo '```'
            echo "~/releases:  $(ls -1 "$HOME/releases" 2>/dev/null | tr '\n' ' ' || echo '<none>')"
            echo "~/current -> $(readlink -f "$HOME/current" 2>/dev/null || echo '<none>')"
            echo '```'
            echo ""
            echo "### Containers and port 3001"
            echo '```'
            docker ps -a --format '{{.Names}} | {{.Image}} | {{.Status}} | {{.Ports}}' 2>&1
            echo "-- published ports of $APP_CONTAINER --"
            docker port "$APP_CONTAINER" 2>&1 || true
            echo "-- listeners on :3001 --"
            (ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null) | grep -E ':3001\b' || echo "(nothing listening on 3001 per ss/netstat)"
            echo '```'
            echo ""
            echo "### How the runner itself is launched"
            echo '```'
            ps -eo pid,ppid,user,args 2>/dev/null | grep -iE 'Runner.Listener|actions-runner|run\.sh' | grep -v grep || echo "(no runner process matched)"
            echo "-- candidate runner dirs --"
            ls -d "$HOME"/actions-runner* /opt/actions-runner* 2>/dev/null || echo "(none)"
            echo "-- system-level units mentioning the runner --"
            systemctl list-units --all --no-pager 2>/dev/null | grep -iE 'actions|runner|catchlogx' || echo "  (none at system level)"
            echo '```'
            echo ""
            echo "### Resources and outbound reachability"
            echo '```'
            df -h "$HOME" 2>&1
            free -h 2>&1 || true
            echo "-- nodejs.org reachable (for the pinned runtime download)? --"
            curl -fsSI --max-time 15 https://nodejs.org/dist/ 2>&1 | head -n1 || echo "curl to nodejs.org failed"
            echo '```'
          } | tee machine-report.txt
          cat machine-report.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-machine-report-${{ github.run_id }}
          path: machine-report.txt
          retention-days: 30
          if-no-files-found: warn

  # Provisions the dedicated smoke-test account that the cutover's sign-in +
  # file-download smoke test signs in with (#141). Production has no credentials
  # we may hold - its seven users are real people - so this account is
  # purpose-built, and its password lives ONLY in the PROD_SMOKE_PASSWORD
  # repository secret: no human ever needs to know the value (#150).
  #
  # This is the second of exactly two jobs allowed to WRITE to production, which
  # is why it carries the same typed confirmation as the cutover. It is additive
  # and idempotent - an upsert of one dedicated row - so it is safe to re-run,
  # and re-running is also the way to rotate the password after the on-site
  # window (#122). It works before AND after the cutover: the adoption (#139)
  # touches only `Uploads`, `TemplateFiles` and `FileBlob`, never `User`.
  smoke-user:
    name: Provision the smoke-test account (#150)
    if: inputs.job == 'smoke-user' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, boku]

    env:
      SMOKE_EMAIL: smoke-test@catchlogx.invalid

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # bcrypt comes from the repo's own dependencies - the same library and
      # cost (10) every write path in the app uses.
      - name: Install dependencies
        run: npm ci

      - name: Require the typed confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "ADOPT-PRODUCTION" ]; then
            echo "::error::refused: re-dispatch with confirm=ADOPT-PRODUCTION"
            exit 1
          fi
          echo "Confirmation accepted."

      # Unlike the cutover's smoke step, this job cannot skip: provisioning the
      # account IS the job. Both secrets must be set.
      - name: Require the smoke-test secrets
        env:
          SMOKE_USER: ${{ secrets.PROD_SMOKE_USER }}
          SMOKE_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$SMOKE_USER" ] || [ -z "$SMOKE_PASSWORD" ]; then
            echo "::error::set the repository secrets PROD_SMOKE_USER and PROD_SMOKE_PASSWORD first"
            exit 1
          fi
          # The username is not secret-grade and later steps need it.
          echo "SMOKE_USER=$SMOKE_USER" >> "$GITHUB_ENV"
          echo "Both smoke-test secrets are present (username: $SMOKE_USER)."

      - name: Preconditions
        run: |
          set -euo pipefail
          docker inspect "$PG_CONTAINER" >/dev/null
          echo "$PG_CONTAINER is running."

      # Refuse to touch an account that is not ours. If the secret names a real
      # user, the upsert below would reset that person's password AND grant them
      # ADMIN - never do that, fail instead.
      - name: Guard against overwriting a foreign account
        run: |
          set -euo pipefail
          FOREIGN="$(docker exec -i "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -A -t \
            -v uname="$SMOKE_USER" -v mail="$SMOKE_EMAIL" <<'SQL'
          SELECT count(*) FROM "User" WHERE username = :'uname' AND email <> :'mail';
          SQL
          )"
          if [ "$FOREIGN" != "0" ]; then
            echo "::error::a user named '$SMOKE_USER' already exists with a different e-mail - refusing to overwrite a real account"
            exit 1
          fi
          EXISTS="$(docker exec -i "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -A -t \
            -v uname="$SMOKE_USER" <<'SQL'
          SELECT count(*) FROM "User" WHERE username = :'uname';
          SQL
          )"
          if [ "$EXISTS" = "1" ]; then
            echo "ACTION=updated" >> "$GITHUB_ENV"
            echo "The account already exists - this run resets its password to the secret."
          else
            echo "ACTION=created" >> "$GITHUB_ENV"
            echo "The account does not exist yet - this run creates it."
          fi

      # The hash is computed in the runner workspace (bcrypt via npm ci) with the
      # secret passed through the environment, so the password never appears on a
      # command line or in a process argument. Raw SQL on purpose: it behaves
      # identically on the legacy db-push schema (where `role` is TEXT) and on
      # the adopted, migration-tracked one - no Prisma enum dependency.
      - name: Upsert the account
        env:
          SMOKE_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD }}
        run: |
          set -euo pipefail
          HASH="$(SMOKE_PASSWORD="$SMOKE_PASSWORD" node -e \
            'require("bcrypt").hash(process.env.SMOKE_PASSWORD, 10).then(h => process.stdout.write(h))')"
          if [ -z "$HASH" ]; then
            echo "::error::could not hash the password"
            exit 1
          fi
          docker exec -i "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -v ON_ERROR_STOP=1 \
            -v uname="$SMOKE_USER" -v mail="$SMOKE_EMAIL" -v hash="$HASH" <<'SQL'
          INSERT INTO "User" (id, username, "hashedPassword", name, email, role, "isActive", "isFirstLogin", "createdAt", "updatedAt")
          VALUES (gen_random_uuid()::text, :'uname', :'hash', 'Deployment smoke test', :'mail', 'ADMIN', true, false, now(), now())
          ON CONFLICT (username) DO UPDATE
            SET "hashedPassword" = EXCLUDED."hashedPassword",
                role             = EXCLUDED.role,
                "isActive"       = EXCLUDED."isActive",
                "isFirstLogin"   = EXCLUDED."isFirstLogin",
                "updatedAt"      = now();
          SQL
          echo "Account '$SMOKE_USER' ${ACTION} (role ADMIN, active, not first login)."

      # Prove the exact loop the cutover depends on end to end: secret -> hash in
      # the database -> bcrypt.compare true. Catches any mangling of the password
      # before the cutover's sign-in would have to.
      - name: Verify the round trip
        env:
          SMOKE_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD }}
        run: |
          set -euo pipefail
          STORED="$(docker exec -i "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -A -t \
            -v uname="$SMOKE_USER" <<'SQL'
          SELECT "hashedPassword" FROM "User" WHERE username = :'uname';
          SQL
          )"
          if [ -z "$STORED" ]; then
            echo "::error::the account was not found after the upsert"
            exit 1
          fi
          SMOKE_PASSWORD="$SMOKE_PASSWORD" STORED="$STORED" node -e '
          require("bcrypt").compare(process.env.SMOKE_PASSWORD, process.env.STORED).then((ok) => {
            if (!ok) {
              console.error("::error::bcrypt round trip failed - the stored hash does not match the secret");
              process.exit(1);
            }
            process.stdout.write("Round trip ok: the secret verifies against the stored hash.\n");
          });
          '

      # Nothing to clean up on failure: the upsert is a single statement, and a
      # failed guard writes nothing at all.
      - name: Failure - what this means
        if: failure()
        run: |
          {
            echo "## Smoke-test account provisioning FAILED"
            echo ""
            echo "No partial state: the upsert is one statement, and a failed guard writes nothing."
            echo "Fix the cause and re-dispatch:"
            echo ""
            echo '```'
            echo "gh workflow run production-maintenance.yml --ref master -f job=smoke-user -f confirm=ADOPT-PRODUCTION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: always()
        run: |
          set +e
          ROW="$(docker exec -i "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -A -t -F'|' \
            -v uname="${SMOKE_USER:-}" <<'SQL'
          SELECT username, role, "isActive", "isFirstLogin" FROM "User" WHERE username = :'uname';
          SQL
          )"
          {
            echo "## Smoke-test account (#150)"
            echo ""
            echo "- Username: \`${SMOKE_USER:-<not resolved>}\` — \`${ACTION:-unknown}\`"
            echo "- Row (username | role | isActive | isFirstLogin): \`${ROW:-<none>}\`"
            echo "- Password: lives only in the \`PROD_SMOKE_PASSWORD\` repository secret — never printed here"
            echo ""
            echo "The cutover (#141) signs in with this account and downloads one upload through"
            echo "the admin route. After the on-site window (#122), delete the account or rotate"
            echo "the secret and re-dispatch this job."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Smoke-test account: ${ROW:-<none>} (${ACTION:-unknown})"

  # One-time cutover of the production machine from the `prisma db push` era to
  # the migration-tracked baseline (#141). Together with `smoke-user` (#150) it
  # is one of exactly two jobs allowed to WRITE to production, and it does so in
  # a single ordered run so there is never a window in which the db-push-era app
  # can come back:
  #   1. retire the old app container - nothing on the machine can run `db push`;
  #   2. fresh database dump + MinIO export (the safety net);
  #   3. run the adoption script (#139);
  #   4. verify: drift empty, `migrate status` up to date, row counts preserved;
  #   5. update the on-machine checkout so the old compose is gone;
  #   6. bring up the new stack, health-check it, smoke-test sign-in + download.
  # The adoption script is idempotent, so the job is re-dispatchable. On any
  # failure the app is left DOWN on purpose (never half-alive) and the recovery
  # contract is printed (see the failure step). Runs ONLY for job=cutover, only
  # on master, and only with the exact confirmation token.
  cutover:
    name: One-time production cutover (#141)
    if: inputs.job == 'cutover' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, boku]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Refuse to touch production unless the operator typed the exact token.
      # Passed through the environment so the input value can never be
      # interpreted by the shell.
      - name: Require the typed confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "ADOPT-PRODUCTION" ]; then
            echo "::error::cutover refused: re-dispatch with confirm=ADOPT-PRODUCTION"
            exit 1
          fi
          echo "Confirmation accepted."

      - name: Preconditions
        run: |
          set -euo pipefail
          docker inspect "$PG_CONTAINER" >/dev/null
          docker inspect "$MINIO_CONTAINER" >/dev/null
          # `clx-web` may legitimately be absent: a re-dispatch after a partial
          # failure starts with the old container already removed.
          if docker inspect "$APP_CONTAINER" >/dev/null 2>&1; then
            echo "$APP_CONTAINER is present (first run)."
          else
            echo "$APP_CONTAINER is already gone (re-dispatch)."
          fi

          # Only two database shapes may be cut over; anything else is a state no
          # automated job may guess at.
          LEGACY="$(docker exec "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -Atc "SELECT to_regclass('public.\"DummyFiles\"') IS NOT NULL")"
          TEMPLATES="$(docker exec "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -Atc "SELECT to_regclass('public.\"TemplateFiles\"') IS NOT NULL")"
          BLOBS="$(docker exec "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -Atc "SELECT to_regclass('public.\"FileBlob\"') IS NOT NULL")"
          if [ "$LEGACY" = "t" ] && [ "$BLOBS" = "f" ]; then
            SHAPE="legacy"
          elif [ "$TEMPLATES" = "t" ] && [ "$BLOBS" = "t" ] && [ "$LEGACY" = "f" ]; then
            SHAPE="adopted"
          else
            echo "::error::unexpected database shape (DummyFiles=$LEGACY TemplateFiles=$TEMPLATES FileBlob=$BLOBS) - refusing to cut over"
            exit 1
          fi
          echo "DB_SHAPE=$SHAPE" >> "$GITHUB_ENV"
          echo "Database shape: $SHAPE"

      # Resolve the connection string BEFORE the app container is removed: the
      # running app is the source of truth. On a re-dispatch it is already gone,
      # so fall back to the secret and finally to the Postgres container's own
      # credentials (5432 is published on loopback).
      - name: Resolve the production database URL
        run: |
          set -euo pipefail
          if docker inspect "$APP_CONTAINER" >/dev/null 2>&1; then
            URL="$(docker exec "$APP_CONTAINER" printenv DATABASE_URL)"
            URL="${URL/@db:5432/@127.0.0.1:5432}"
          else
            URL="${{ secrets.PROD_DATABASE_URL }}"
          fi
          if [ -z "$URL" ]; then
            PGPASS="$(docker exec "$PG_CONTAINER" printenv POSTGRES_PASSWORD 2>/dev/null || true)"
            if [ -z "$PGPASS" ]; then
              echo "::error::Could not determine the production database URL"
              exit 1
            fi
            URL="postgresql://${PG_USER}:${PGPASS}@127.0.0.1:5432/${PG_DB}?schema=public"
          fi
          echo "PROD_DATABASE_URL=$URL" >> "$GITHUB_ENV"
          echo "Resolved the production database URL."

      # Step 1: retire the db-push-era app. From here on nothing on the machine
      # can run `db push` again, and the app is intentionally down.
      - name: Retire the db-push-era app container
        run: |
          set -euo pipefail
          if docker inspect "$APP_CONTAINER" >/dev/null 2>&1; then
            docker update --restart=no "$APP_CONTAINER"
            docker stop "$APP_CONTAINER"
            docker rm "$APP_CONTAINER"
            echo "Removed $APP_CONTAINER with its restart policy disabled."
          else
            echo "$APP_CONTAINER is already gone - nothing to retire."
          fi

      # Step 2: the safety net. Fail if either the dump or the export is empty.
      - name: Back up the database and the MinIO bucket
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          DEST="$HOME/$BACKUP_ROOT/cutover-$STAMP"
          mkdir -p "$DEST/minio"
          echo "CUTOVER_STAMP=$STAMP" >> "$GITHUB_ENV"
          echo "CUTOVER_DEST=$DEST" >> "$GITHUB_ENV"

          # Local socket inside the container: the official postgres image
          # trusts local connections, so no password is involved here.
          docker exec "$PG_CONTAINER" pg_dump -U "$PG_USER" -d "$PG_DB" -Fc > "$DEST/db.dump"
          test -s "$DEST/db.dump" || { echo "::error::the database dump is empty"; exit 1; }
          # Never trust an archive we have not listed (custom format -> pg_restore).
          docker run --rm -v "$DEST:/backup:ro" postgres:16-alpine \
            pg_restore --list /backup/db.dump > "$DEST/db.dump.list"
          test -s "$DEST/db.dump.list" || { echo "::error::the database dump did not list"; exit 1; }

          # Run mc as the runner user so the export is not root-owned.
          NET="$(docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{"\n"}}{{end}}' "$MINIO_CONTAINER" | head -n1)"
          MC_HOME="$(mktemp -d)"
          docker run --rm --network "$NET" --user "$(id -u):$(id -g)" \
            -v "$DEST/minio:/backup" -v "$MC_HOME:/mc-home" -e HOME=/mc-home \
            -e "MC_HOST_prod=http://${MC_USER}:${MC_PASS}@${MINIO_CONTAINER}:9000" \
            minio/mc:latest mirror --overwrite "prod/${MINIO_BUCKET}" /backup
          rm -rf "$MC_HOME"
          COUNT="$(find "$DEST/minio" -type f | wc -l)"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::the MinIO export produced no files"
            exit 1
          fi
          echo "Backup set: $DEST (dump $(du -h "$DEST/db.dump" | cut -f1), $COUNT objects)"

      # Row counts must survive the adoption unchanged. The legacy table name is
      # normalised so a re-dispatch over an already-adopted database compares the
      # same set; `_prisma_migrations` and the new `FileBlob` table are excluded
      # from both sides for the same reason.
      - name: Row counts before
        run: |
          set -euo pipefail
          docker exec -i "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -A -t -F'|' <<'SQL' \
            | sed 's/^public\.DummyFiles/public.TemplateFiles/' \
            | grep -v _prisma_migrations \
            | grep -v "^public.FileBlob|" \
            | sort > row-counts-before.txt
          SELECT format('SELECT %L, count(*) FROM %I.%I;', n.nspname||'.'||c.relname, n.nspname, c.relname)
          FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
          WHERE c.relkind = 'r' AND n.nspname = 'public'
          ORDER BY 1 \gexec
          SQL
          cat row-counts-before.txt
          grep '^public.Session|' row-counts-before.txt || true

      # Step 3: the adoption itself.
      - name: Adoption (dry run)
        run: |
          set -euo pipefail
          DATABASE_URL="$PROD_DATABASE_URL" npx tsx scripts/adopt-legacy-prod.ts --source-dir "$CUTOVER_DEST/minio" --dry-run

      - name: Adoption (apply)
        run: |
          set -euo pipefail
          DATABASE_URL="$PROD_DATABASE_URL" npx tsx scripts/adopt-legacy-prod.ts --source-dir "$CUTOVER_DEST/minio"

      - name: Adoption (second run must be a no-op)
        run: |
          set -euo pipefail
          OUTPUT="$(DATABASE_URL="$PROD_DATABASE_URL" npx tsx scripts/adopt-legacy-prod.ts --source-dir "$CUTOVER_DEST/minio")"
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "write 0 blob(s)" || { echo "::error::second run was not a no-op"; exit 1; }

      # Step 4: the same bookkeeping the rehearsal proved: mark the history as
      # applied (only for migrations not yet recorded, so a re-dispatch is safe),
      # then prove that migrate deploy is a no-op and the schema matches exactly.
      - name: Migration bookkeeping and drift check
        env:
          DATABASE_URL: ${{ env.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          resolve_if_needed() {
            local name="$1" recorded
            recorded="$(docker exec "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -Atc \
              "SELECT 1 FROM \"_prisma_migrations\" WHERE migration_name = '$name' LIMIT 1" 2>/dev/null || true)"
            if [ -n "$recorded" ]; then
              echo "$name is already recorded - skipping resolve."
            else
              npx prisma migrate resolve --applied "$name"
            fi
          }
          resolve_if_needed 20261017190000_init
          resolve_if_needed 20261017200000_replace_minio_with_file_blobs
          npx prisma migrate status | tee migration-state.txt
          npx prisma migrate deploy
          npx prisma migrate diff \
            --from-url "$PROD_DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --script > drift-after.sql
          if grep -q 'This is an empty migration' drift-after.sql; then
            echo "Schema matches schema.prisma exactly."
          else
            echo "::error::the adopted schema still differs from schema.prisma"
            cat drift-after.sql
            exit 1
          fi

      - name: Blob verification
        run: |
          set -euo pipefail
          docker exec -i "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -A -t -F'|' <<'SQL' | tee blob-report.txt
          SELECT 'blobs='||count(*)||' bytes='||coalesce(sum("sizeBytes"),0) FROM "FileBlob";
          SELECT 'uploads unlinked='||count(*) FROM "Uploads" WHERE "blobId" IS NULL;
          SELECT 'templates unlinked='||count(*) FROM "TemplateFiles" WHERE "blobId" IS NULL;
          SELECT 'uploads with mismatched size='||count(*) FROM "Uploads" u JOIN "FileBlob" b ON b.id = u."blobId" WHERE b."sizeBytes" <> length(b.data);
          SQL
          grep -q '^uploads unlinked=0$' blob-report.txt || { echo "::error::an upload has no blob"; exit 1; }
          grep -q '^templates unlinked=0$' blob-report.txt || { echo "::error::a template has no blob"; exit 1; }
          grep -q '^uploads with mismatched size=0$' blob-report.txt || { echo "::error::a blob size does not match its bytes"; exit 1; }

      - name: Row counts after
        run: |
          set -euo pipefail
          docker exec -i "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -A -t -F'|' <<'SQL' \
            | sed 's/^public\.DummyFiles/public.TemplateFiles/' \
            | grep -v _prisma_migrations \
            | grep -v "^public.FileBlob|" \
            | sort > row-counts-after.txt
          SELECT format('SELECT %L, count(*) FROM %I.%I;', n.nspname||'.'||c.relname, n.nspname, c.relname)
          FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
          WHERE c.relkind = 'r' AND n.nspname = 'public'
          ORDER BY 1 \gexec
          SQL
          cat row-counts-after.txt
          if diff -u row-counts-before.txt row-counts-after.txt > counts.diff; then
            echo "Row counts preserved by the adoption."
          else
            echo "::error::row counts changed during the adoption"
            cat counts.diff
            exit 1
          fi
          echo "Sessions before: $(grep '^public.Session|' row-counts-before.txt || echo 'n/a')"
          echo "Sessions after:  $(grep '^public.Session|' row-counts-after.txt || echo 'n/a')"

      # Step 5: the on-machine checkout must move to the upgrading commit before
      # the stack is brought up, because the container runs FROM that checkout.
      # This is what removes the old compose (with `prisma db push`) from the
      # machine.
      - name: Point the on-machine checkout at the upgrading commit
        run: |
          set -euo pipefail
          cd /opt/CatchLogX
          git fetch origin master
          git reset --hard "${{ github.sha }}"
          for compose in docker-compose.yml docker-compose.yaml; do
            if [ -f "$compose" ] && grep -q 'db push' "$compose"; then
              echo "::error::$compose still contains a db push command"
              exit 1
            fi
          done
          echo "Checkout updated to $(git rev-parse --short HEAD); no db push in the compose file."

      # Step 6: bring up the new code (it applies migrations, now a no-op) and
      # health-check it. The app builds inside the container on first start
      # (npm ci + next build on a desktop machine), so allow up to ~20 minutes.
      # Only an EXITED container is a fail-fast condition - a container that is
      # briefly "created" while compose starts it must not abort the job.
      - name: Bring up the new stack and health-check it
        run: |
          set -euo pipefail
          cd /opt/CatchLogX
          docker compose up -d --build
          for attempt in $(seq 1 120); do
            STATUS="$(docker inspect -f '{{.State.Status}}' "$APP_CONTAINER" 2>/dev/null || echo missing)"
            if [ "$STATUS" = "exited" ] || [ "$STATUS" = "dead" ]; then
              echo "::error::$APP_CONTAINER exited before becoming healthy"
              docker logs --tail 50 "$APP_CONTAINER" || true
              exit 1
            fi
            if [ "$STATUS" = "running" ] && curl -fsS -o /dev/null http://127.0.0.1:3001/; then
              echo "New stack is healthy (attempt $attempt)."
              exit 0
            fi
            sleep 10
          done
          echo "::error::health check timed out after ~20 minutes"
          docker logs --tail 100 "$APP_CONTAINER" || true
          exit 1

      # Sign-in + file download smoke test. The secrets must hold an ADMIN (or
      # SUPER_ADMIN) account on production: the download goes through the
      # admin-only route. If they are unset the job does NOT fail - it warns, and
      # the report says the smoke test was skipped.
      - name: Smoke test (sign-in, session, file download)
        env:
          SMOKE_USER: ${{ secrets.PROD_SMOKE_USER }}
          SMOKE_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$SMOKE_USER" ] || [ -z "$SMOKE_PASSWORD" ]; then
            echo "::warning::PROD_SMOKE_USER/PROD_SMOKE_PASSWORD are not set - skipping the smoke test"
            echo "Smoke test: SKIPPED (set PROD_SMOKE_USER/PROD_SMOKE_PASSWORD)" | tee smoke-result.txt
            echo "Smoke test: SKIPPED (set PROD_SMOKE_USER/PROD_SMOKE_PASSWORD)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Build the JSON body in Node so credentials can never be mangled by
          # the shell.
          BODY="$(SMOKE_USER="$SMOKE_USER" SMOKE_PASSWORD="$SMOKE_PASSWORD" node -e \
            'process.stdout.write(JSON.stringify({username:process.env.SMOKE_USER,password:process.env.SMOKE_PASSWORD}))')"

          # 1. sign in and capture the session cookie.
          CODE="$(curl -sS -o signin.json -w '%{http_code}' -c cookies.txt \
            -H 'Content-Type: application/json' -d "$BODY" \
            http://127.0.0.1:3001/api/auth/sign-in)"
          if [ "$CODE" != "200" ]; then
            echo "::error::sign-in returned HTTP $CODE"; cat signin.json; exit 1
          fi
          grep -q 'session-token' cookies.txt || { echo "::error::no session-token cookie was set"; exit 1; }

          # 2. the cookie validates against the preserved Session table.
          CODE="$(curl -sS -o session.json -w '%{http_code}' -b cookies.txt \
            http://127.0.0.1:3001/api/auth/session)"
          if [ "$CODE" != "200" ] || ! grep -q '"authenticated":true' session.json; then
            echo "::error::session validation failed (HTTP $CODE)"; cat session.json; exit 1
          fi

          # 3. download one real upload through the admin route and compare bytes.
          ROW="$(docker exec -i "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -A -t -F'|' -c \
            'SELECT u.id, b."sizeBytes" FROM "Uploads" u JOIN "FileBlob" b ON b.id = u."blobId" LIMIT 1')"
          ID="${ROW%%|*}"; SIZE="${ROW##*|}"
          if [ -z "$ID" ] || [ "$ID" = "$SIZE" ]; then
            echo "::error::no upload with a blob found"; exit 1
          fi
          CODE="$(curl -sS -o download.bin -w '%{http_code}' -b cookies.txt \
            "http://127.0.0.1:3001/api/admin/download/$ID")"
          if [ "$CODE" != "200" ]; then
            echo "::error::file download returned HTTP $CODE"; exit 1
          fi
          GOT="$(stat -c%s download.bin)"
          if [ "$GOT" != "$SIZE" ]; then
            echo "::error::downloaded $GOT bytes, expected $SIZE"; exit 1
          fi
          echo "Smoke test: OK (sign-in, session, download of $ID, $GOT bytes)" | tee smoke-result.txt

      # The failure path. It must run before the summary and must never touch the
      # on-machine checkout (its state is unknown). The app is stopped, not
      # restarted: a half-alive production is worse than a stopped one.
      - name: Failure - stop the app and print the recovery contract
        if: failure()
        run: |
          set +e
          docker stop "$APP_CONTAINER" >/dev/null 2>&1 || true

          DEST="${CUTOVER_DEST:-<no backup set was created>}"
          read -r -d '' CONTRACT <<EOF
          ============================== RECOVERY CONTRACT ==============================
          The application is DOWN ON PURPOSE. Do not run the db-push-era code against
          the database again.

          Option A - fix the cause and re-dispatch this job. The cutover is idempotent
          and finishes whatever is still missing:
            gh workflow run production-maintenance.yml --ref master -f job=cutover -f confirm=ADOPT-PRODUCTION

          Option B - restore first, then re-dispatch. The pre-cutover dump is at
          $DEST/db.dump (custom format, verified with pg_restore --list):
            docker exec -i $PG_CONTAINER pg_restore -U $PG_USER -d $PG_DB --clean --if-exists < "$DEST/db.dump"
          then re-dispatch this job.

          NEVER run the legacy compose or the db-push-era app against the adopted schema.
          ===============================================================================
          EOF
          echo "$CONTRACT"
          {
            echo "## Cutover FAILED - the app is stopped"
            echo ""
            echo '```'
            echo "$CONTRACT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Production cutover (#141)"
            echo ""
            echo "- Database shape at start: \`${DB_SHAPE:-unknown}\`"
            echo "- Backup set on the machine: \`${CUTOVER_DEST:-<none>}\`"
            echo ""
            echo "### Migration state after the adoption"
            echo '```'
            cat migration-state.txt 2>/dev/null || true
            echo '```'
            echo ""
            echo "### Remaining schema drift (must be empty)"
            echo '```sql'
            cat drift-after.sql 2>/dev/null || true
            echo '```'
            echo ""
            echo "### Row counts before / after"
            echo '```'
            cat row-counts-before.txt 2>/dev/null || true
            echo '--- diff (must be empty) ---'
            cat counts.diff 2>/dev/null || echo "(no diff: row counts preserved)"
            echo '```'
            echo ""
            echo "### Sessions (must be identical - users are not logged out)"
            echo '```'
            grep '^public.Session|' row-counts-before.txt 2>/dev/null | sed 's/^/before: /' || true
            grep '^public.Session|' row-counts-after.txt 2>/dev/null | sed 's/^/after:  /' || true
            echo '```'
            echo ""
            echo "### Blobs"
            echo '```'
            cat blob-report.txt 2>/dev/null || true
            echo '```'
            echo ""
            echo "### Smoke test"
            echo '```'
            cat smoke-result.txt 2>/dev/null || echo "Smoke test: not reached"
            echo '```'
            echo ""
            echo "### Recovery contract (only relevant if the job failed)"
            echo '```'
            echo "App stays stopped on failure. Re-dispatch this idempotent job (with"
            echo "confirm=ADOPT-PRODUCTION), or restore \$CUTOVER_DEST/db.dump first."
            echo '```'
            echo ""
            echo "### Production state after the cutover - record in docs/ai/STATE.md"
            echo '```'
            echo "Cutover run:       https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Upgrading commit:  ${{ github.sha }}"
            echo "Backup set:        ${CUTOVER_DEST:-<none>}"
            echo "Blobs:             $(head -n 1 blob-report.txt 2>/dev/null || echo 'n/a')"
            echo "Sessions:          $(grep '^public.Session|' row-counts-after.txt 2>/dev/null || echo 'n/a')"
            echo "Smoke test:        $(head -n 1 smoke-result.txt 2>/dev/null || echo 'n/a')"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Structural reports only - never the dump or the MinIO export (the repo
      # is public).
      - name: Upload structural reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-cutover-${{ github.run_id }}
          path: |
            row-counts-before.txt
            row-counts-after.txt
            counts.diff
            blob-report.txt
            drift-after.sql
            migration-state.txt
            smoke-result.txt
          retention-days: 30
          if-no-files-found: warn

  # Provisions the immutable-release runtime on the production machine (#143):
  # a pinned Node under ~/tools, the on-machine runtime env file, and the
  # systemd USER unit that runs `node ~/current/server.js`. It deliberately does
  # NOT touch the running app: the interim container keeps serving until the
  # first release deploy retires it and starts the unit, so downtime stays a
  # plain restart. Idempotent and re-dispatchable.
  #
  # THIS IS ONE OF THE THREE JOBS THAT MAY WRITE TO PRODUCTION (with `cutover`
  # and `smoke-user`), so it carries the same three gates: dispatch-only,
  # ref-guarded to `master`, and armed by `confirm=ADOPT-PRODUCTION`.
  release-topology:
    name: Provision the immutable-release topology (#143)
    if: inputs.job == 'release-topology' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, boku]

    env:
      NODE_VERSION: v22.23.3
      ENV_FILE: /opt/CatchLogX/.env
      REPO_DIR: /opt/CatchLogX
      UNIT_NAME: catchlogx.service

    steps:
      - uses: actions/checkout@v4

      - name: Require the typed confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "ADOPT-PRODUCTION" ]; then
            echo "::error::refused: re-dispatch with confirm=ADOPT-PRODUCTION"
            exit 1
          fi
          echo "Confirmation accepted."

      # The runner is a SYSTEM service (actions.runner.*.service) with no logind
      # session, so a `systemd --user` manager only exists once linger is enabled
      # (`loginctl enable-linger clxadmin`). This step points the job at that
      # manager and, if it is missing, tries to enable linger non-interactively;
      # if sudo needs a password it stops with the exact on-site command.
      - name: Locate the user systemd manager
        run: |
          set -euo pipefail
          RUNDIR="/run/user/$(id -u)"
          echo "XDG_RUNTIME_DIR=$RUNDIR" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$RUNDIR/bus" >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR="$RUNDIR"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$RUNDIR/bus"

          reachable() {
            case "$(systemctl --user is-system-running 2>/dev/null || true)" in
              running|degraded) return 0 ;;
              *) return 1 ;;
            esac
          }

          if reachable; then
            echo "systemd user manager is reachable ($(systemctl --user is-system-running 2>/dev/null))."
            exit 0
          fi

          echo "No user manager yet - trying to enable linger for $(id -un)."
          if sudo -n loginctl enable-linger "$(id -un)" 2>/dev/null; then
            echo "Linger enabled."
          else
            echo "::warning::could not enable linger non-interactively (sudo needs a password?)"
          fi
          for _ in $(seq 1 20); do
            if reachable; then
              echo "systemd user manager is up."
              exit 0
            fi
            sleep 1
          done
          echo "::error::no systemd user manager for '$(id -un)'. On-site run:  sudo loginctl enable-linger $(id -un)   then re-dispatch this job."
          exit 1

      - name: Preconditions
        run: |
          set -euo pipefail
          docker inspect "$PG_CONTAINER" >/dev/null || { echo "::error::$PG_CONTAINER not found"; exit 1; }

          # Post-cutover work only: the database must already be adopted (#141).
          BLOBS="$(docker exec "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -Atc "SELECT to_regclass('public.\"FileBlob\"') IS NOT NULL")"
          if [ "$BLOBS" != "t" ]; then
            echo "::error::production is not on the adopted schema yet - run the cutover (#141) first"
            exit 1
          fi

          if [ ! -w "$REPO_DIR" ]; then
            echo "::error::$REPO_DIR is not writable by $(id -un) - cannot place the runtime env file"
            exit 1
          fi
          echo "Preconditions ok (adopted schema, user manager, writable $REPO_DIR)."

      - name: Install the pinned Node runtime (~/tools)
        run: |
          set -euo pipefail
          TOOLS="$HOME/tools"
          DEST="$TOOLS/node-$NODE_VERSION"
          mkdir -p "$TOOLS"
          ARCH="linux-x64"
          if [ -x "$DEST/bin/node" ]; then
            echo "Node already present: $("$DEST/bin/node" --version) at $DEST"
          else
            TMP="$(mktemp -d)"
            # Keep the upstream filename: SHASUMS256.txt lists that name and
            # `sha256sum -c` resolves it relative to the current directory, so
            # a renamed download failed the check with "FAILED open or read"
            # (first real run of this job, 2026-10-27).
            TARBALL="node-$NODE_VERSION-$ARCH.tar.xz"
            URL="https://nodejs.org/dist/$NODE_VERSION/$TARBALL"
            echo "Downloading $URL"
            curl -fsSL --max-time 600 "$URL" -o "$TMP/$TARBALL"
            curl -fsSL --max-time 120 "https://nodejs.org/dist/$NODE_VERSION/SHASUMS256.txt" -o "$TMP/SHASUMS256.txt"
            ( cd "$TMP" && grep " $TARBALL\$" SHASUMS256.txt | sha256sum -c - )
            tar -xJf "$TMP/$TARBALL" -C "$TMP"
            rm -rf "$DEST"
            mv "$TMP/node-$NODE_VERSION-$ARCH" "$DEST"
            rm -rf "$TMP"
            echo "Installed $("$DEST/bin/node" --version) at $DEST"
          fi
          ln -sfn "$DEST" "$TOOLS/node"
          echo "~/tools/node -> $(readlink "$TOOLS/node")"
          "$TOOLS/node/bin/node" --version

      - name: Write the on-machine runtime env file
        run: |
          set -euo pipefail
          # Derive the runtime environment from the RUNNING app container - the
          # same source of truth every other job uses - so credentials are not
          # hand-copied. The only rewrite is the database host: inside the
          # container it is the compose service `db`, for the host runtime it is
          # the loopback port the database publishes.
          ALLOW='^(NODE_ENV|DATABASE_URL|NEXTAUTH_URL|NEXTAUTH_SECRET|NEXT_PUBLIC_APP_URL|NEXT_TELEMETRY_DISABLED|NODEMAILER_HOST|NODEMAILER_PORT|NODEMAILER_USER|NODEMAILER_PASSWORD|NODEMAILER_SECURE)='
          if docker inspect "$APP_CONTAINER" >/dev/null 2>&1; then
            docker exec "$APP_CONTAINER" printenv \
              | grep -E "$ALLOW" \
              | sed 's#@db:5432#@127.0.0.1:5432#' > "$ENV_FILE.tmp"
          elif [ -f "$ENV_FILE" ]; then
            echo "$APP_CONTAINER is gone - keeping the existing $ENV_FILE."
            cp "$ENV_FILE" "$ENV_FILE.tmp"
          else
            echo "::error::cannot determine the runtime environment (no $APP_CONTAINER, no $ENV_FILE)"
            exit 1
          fi
          chmod 600 "$ENV_FILE.tmp"
          # Preserve machine-local keys that do NOT come from the container
          # environment - notably READONLY_DB_PASSWORD, written by the
          # readonly-role job (#152). A re-dispatch here must not drop them.
          if [ -f "$ENV_FILE" ]; then
            grep -vE "$ALLOW" "$ENV_FILE" | grep -E '^[A-Za-z_][A-Za-z0-9_]*=' >> "$ENV_FILE.tmp" || true
          fi
          mv "$ENV_FILE.tmp" "$ENV_FILE"
          echo "Wrote $ENV_FILE (mode 600). Keys present:"
          sed -E 's/=.*/=<set>/' "$ENV_FILE" | sort

      - name: Write and enable the systemd user unit
        run: |
          set -euo pipefail
          UNIT_DIR="$HOME/.config/systemd/user"
          mkdir -p "$UNIT_DIR"
          NODE_BIN="$HOME/tools/node/bin/node"
          cat > "$UNIT_DIR/$UNIT_NAME" <<UNIT
          [Unit]
          Description=CatchLogX production server (immutable standalone release, #143)
          Documentation=https://github.com/georgernstgraf/CatchLogX

          [Service]
          # Runs the release published by the deploy job: ~/current points at
          # ~/releases/<sha>/ and is swapped atomically before the restart. The
          # running server never builds. HOSTNAME=127.0.0.1 since #164: the app
          # is no longer reachable from the network - nginx on :80 proxies to
          # it, and the former public URL on port 3001 redirects to :80. PORT
          # stays 3001 (see deploy/prod/ for the machine-side nginx config).
          WorkingDirectory=%h/current
          EnvironmentFile=$ENV_FILE
          Environment=NODE_ENV=production
          Environment=PORT=3001
          Environment=HOSTNAME=127.0.0.1
          ExecStart=$NODE_BIN %h/current/server.js
          Restart=on-failure
          RestartSec=5
          KillMode=mixed
          TimeoutStopSec=30

          [Install]
          WantedBy=default.target
          UNIT
          systemctl --user daemon-reload
          systemctl --user enable "$UNIT_NAME"
          if [ -e "$HOME/current/server.js" ]; then
            systemctl --user restart "$UNIT_NAME"
            echo "Restarted $UNIT_NAME against the existing release."
          else
            echo "No release yet (~/current/server.js missing) - the unit is enabled and starts with the first deploy."
          fi

      - name: Verify (one unit, no port race, linger)
        run: |
          set -euo pipefail
          echo "=== is-enabled ==="
          systemctl --user is-enabled "$UNIT_NAME" || true
          echo "=== unit file ==="
          systemctl --user cat "$UNIT_NAME"
          echo "=== status ==="
          systemctl --user --no-pager status "$UNIT_NAME" || true

          # Exactly one unit may own the app and its port (the dev-instance
          # lesson: two units racing for a port cause an EADDRINUSE loop).
          UNIT_DIR="$HOME/.config/systemd/user"
          COMPETING="$(grep -lE 'server\.js|PORT=3001' "$UNIT_DIR"/*.service 2>/dev/null | grep -v "/$UNIT_NAME\$" || true)"
          if [ -n "$COMPETING" ]; then
            echo "::error::another user unit also targets the app or its port: $COMPETING"
            exit 1
          fi
          echo "Exactly one unit ($UNIT_NAME) targets the app and its port."

          if [ -e "/var/lib/systemd/linger/$(id -un)" ] || [ "$(loginctl show-user "$(id -un)" -p Linger --value 2>/dev/null)" = "yes" ]; then
            echo "linger is enabled - the unit survives logout and starts on boot."
          else
            echo "::warning::linger is NOT enabled - the unit will not survive logout/reboot. On-site: sudo loginctl enable-linger $(id -un)"
          fi

      - name: Summary
        if: always()
        run: |
          set +e
          {
            echo "## Immutable-release topology provisioned (#143)"
            echo ""
            echo "- Node runtime: \`$HOME/tools/node-$NODE_VERSION\` (\`~/tools/node\`)"
            echo "- Runtime env file: \`$ENV_FILE\` (mode 600, lives on the machine, not in the repo)"
            echo "- Unit: \`$UNIT_NAME\` (\`node ~/current/server.js\`, 127.0.0.1:3001)"
            echo "- Linger: \`$( [ -e "/var/lib/systemd/linger/$(id -un)" ] && echo yes || echo 'no/unknown' )\`"
            echo ""
            echo "Next: dispatch a release deploy. The app container is retired there and the unit starts."
            echo ""
            echo "Secret rotation (deferred, #122): edit \`$ENV_FILE\` (and the PG password), then"
            echo "\`systemctl --user restart $UNIT_NAME\` - no rebuild."
          } >> "$GITHUB_STEP_SUMMARY"

  # Shared read-only database role for the scientific staff who run statistics
  # (mainly with R) directly against the production database (#152). The port is
  # already published on all interfaces; the role is the real access boundary
  # (a SELECT-only login that cannot reach the auth tables).
  #
  # The password is generated ON the machine and never leaves it: it is set on
  # the role and stored in the on-machine env file as READONLY_DB_PASSWORD (the
  # future in-app data-access page reads it from there). It is never printed,
  # never an artifact and never a repository secret. Re-dispatching this job IS
  # the rotation.
  #
  # THIS IS ONE OF THE FOUR JOBS THAT MAY WRITE TO PRODUCTION (with `cutover`,
  # `smoke-user` and `release-topology`), so it carries the same three gates:
  # dispatch-only, ref-guarded to `master`, armed by `confirm=ADOPT-PRODUCTION`.
  readonly-role:
    name: Provision the read-only statistics role (#152)
    if: inputs.job == 'readonly-role' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, boku]

    env:
      ENV_FILE: /opt/CatchLogX/.env
      ROLE: clx_readonly

    steps:
      - uses: actions/checkout@v4

      - name: Require the typed confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "ADOPT-PRODUCTION" ]; then
            echo "::error::refused: re-dispatch with confirm=ADOPT-PRODUCTION"
            exit 1
          fi
          echo "Confirmation accepted."

      - name: Preconditions
        run: |
          set -euo pipefail
          docker inspect "$PG_CONTAINER" >/dev/null || { echo "::error::$PG_CONTAINER not found"; exit 1; }
          BLOBS="$(docker exec "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -Atc "SELECT to_regclass('public.\"FileBlob\"') IS NOT NULL")"
          if [ "$BLOBS" != "t" ]; then
            echo "::error::production is not on the adopted schema yet - run the cutover (#141) first"
            exit 1
          fi

      # The password is generated here, on the machine, and never echoed. The
      # `::add-mask::` plus $GITHUB_ENV hand it to later steps without ever
      # appearing in the log.
      - name: Generate the password (never printed)
        run: |
          set -euo pipefail
          PW="$(openssl rand -base64 9)"
          echo "::add-mask::$PW"
          echo "READONLY_PW=$PW" >> "$GITHUB_ENV"
          echo "Generated a $(printf %s "$PW" | wc -c)-character password (masked)."

      - name: Upsert the role and its grants
        run: |
          set -euo pipefail
          pg() {
            docker exec -i "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -v ON_ERROR_STOP=1 \
              -v role="$ROLE" -v pass="$READONLY_PW" -v db="$PG_DB" "$@"
          }

          # Every expected auth table must exist (drift guard), and we build the
          # comma-separated identifier lists used below.
          AUTH_LIST=""
          for t in User Session PasswordResets; do
            if [ "$(docker exec "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -Atc "SELECT to_regclass('public.\"$t\"') IS NOT NULL")" != "t" ]; then
              echo "::error::expected auth table '$t' not found - fix the list in this job before granting access"
              exit 1
            fi
            if [ -n "$AUTH_LIST" ]; then AUTH_LIST="$AUTH_LIST, "; fi
            AUTH_LIST="$AUTH_LIST\"$t\""
          done

          # GRANT only the NON-auth tables, positively. The auth tables are never
          # granted at all, so a failure mid-statement can never leave them
          # readable (the first dispatch proved the reverse order can).
          TABLES="$(docker exec "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -Atc \
            "SELECT string_agg(format('%I', tablename), ', ') FROM pg_tables WHERE schemaname = 'public' AND tablename NOT IN ('User','Session','PasswordResets')")"
          if [ -z "$TABLES" ]; then
            echo "::error::no readable tables found in schema public"
            exit 1
          fi
          echo "Granting SELECT on: $TABLES"
          echo "Withholding (auth tables): $AUTH_LIST"

          EXISTS="$(docker exec "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -Atc "SELECT 1 FROM pg_roles WHERE rolname = '$ROLE'")"
          if [ -z "$EXISTS" ]; then
            pg <<'SQL'
          CREATE ROLE :"role" LOGIN PASSWORD :'pass'
            NOSUPERUSER NOCREATEDB NOCREATEROLE CONNECTION LIMIT 20;
          SQL
            echo "Created role $ROLE."
          else
            pg <<'SQL'
          ALTER ROLE :"role" WITH LOGIN PASSWORD :'pass'
            NOSUPERUSER NOCREATEDB NOCREATEROLE CONNECTION LIMIT 20;
          SQL
            echo "Updated role $ROLE (password rotated)."
          fi

          # The positive grant, then a REVOKE on the auth tables as
          # belt-and-braces (covers a grant made interactively earlier).
          pg <<SQL
          GRANT CONNECT ON DATABASE :"db" TO :"role";
          GRANT USAGE ON SCHEMA public TO :"role";
          GRANT SELECT ON TABLE $TABLES TO :"role";
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO :"role";
          REVOKE SELECT ON TABLE $AUTH_LIST FROM :"role";
          SQL
          echo "Grants applied: SELECT on the non-auth tables only."

      - name: Verify (password on the real path, reads allowed, writes and auth tables denied)
        run: |
          set -euo pipefail

          # The container's pg_hba trusts loopback (127.0.0.1/32) and only
          # enforces scram-sha-256 on non-loopback sources - the path the BOKU
          # clients actually take. Print those rules and refuse a catch-all
          # `trust`: with it the read-only password would be meaningless.
          HBA="$(docker exec "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -Atc 'SHOW hba_file')"
          echo "=== effective pg_hba host rules ($HBA) ==="
          docker exec "$PG_CONTAINER" cat "$HBA" | grep -vE '^\s*#|^\s*$' | grep -E '^host' || true
          if docker exec "$PG_CONTAINER" cat "$HBA" | grep -qE '^host[[:space:]]+all[[:space:]]+all[[:space:]]+all[[:space:]]+trust'; then
            echo "::error::pg_hba trusts external connections - the read-only password is meaningless"
            exit 1
          fi

          # Connect from OUTSIDE the container (a separate one on the same
          # network, using the container IP) so the password is really checked.
          NET="$(docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{"\n"}}{{end}}' "$PG_CONTAINER" | head -n1)"
          PG_IP="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}' "$PG_CONTAINER" | awk '{print $1}')"
          ext() {
            docker run --rm --network "$NET" -e PGPASSWORD="$1" postgres:16-alpine \
              psql -h "$PG_IP" -U "$ROLE" -d "$PG_DB" -Atc "$2"
          }

          if ext "definitely-wrong" 'SELECT 1' >/dev/null 2>&1; then
            echo "::error::the role connected with a wrong password - password auth is not enforced"
            exit 1
          fi
          echo "Wrong password rejected."

          # Read probe on any granted table - picked from the schema, not
          # hardcoded (several models are @@map'd, e.g. FishCatch -> fish_catches).
          READ_TABLE="$(docker exec "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -Atc \
            "SELECT tablename FROM pg_tables WHERE schemaname = 'public' AND tablename NOT IN ('User','Session','PasswordResets') ORDER BY tablename LIMIT 1")"
          if [ -z "$READ_TABLE" ]; then
            echo "::error::no granted table to read"
            exit 1
          fi
          ext "$READONLY_PW" "SELECT count(*) FROM \"$READ_TABLE\";" > /dev/null
          echo "Password accepted, read allowed ($READ_TABLE)."

          # Permission checks: loopback is fine - authorisation does not depend
          # on how the connection authenticated.
          as_role() {
            docker exec -i -e PGPASSWORD="$READONLY_PW" "$PG_CONTAINER" \
              psql -U "$ROLE" -h 127.0.0.1 -d "$PG_DB" -v ON_ERROR_STOP=1 "$@"
          }

          if as_role -Atc 'SELECT 1 FROM "Session" LIMIT 1;' >/dev/null 2>&1; then
            echo "::error::the read-only role can read Session - the REVOKE did not take effect"
            exit 1
          fi
          echo "Auth tables denied (Session)."

          if as_role -Atc 'CREATE TABLE public._readonly_probe(i int);' >/dev/null 2>&1; then
            as_role -Atc 'DROP TABLE public._readonly_probe;' >/dev/null 2>&1 || true
            echo "::error::the read-only role can write to public"
            exit 1
          fi
          echo "Writes denied (CREATE TABLE refused)."

          ATTRS="$(docker exec "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -Atc \
            "SELECT rolsuper||'|'||rolcreatedb||'|'||rolcreaterole||'|'||rolcanlogin||'|'||rolconnlimit FROM pg_roles WHERE rolname='$ROLE'")"
          echo "pg_roles (super|createdb|createrole|canlogin|connlimit): $ATTRS"

      - name: Record the password in the on-machine env file
        run: |
          set -euo pipefail
          TMP="$(mktemp)"
          if [ -f "$ENV_FILE" ]; then
            grep -v '^READONLY_DB_PASSWORD=' "$ENV_FILE" > "$TMP" || true
          fi
          printf 'READONLY_DB_PASSWORD=%s\n' "$READONLY_PW" >> "$TMP"
          chmod 600 "$TMP"
          mv "$TMP" "$ENV_FILE"
          echo "$ENV_FILE updated (value not shown). Keys present:"
          sed -E 's/=.*/=<set>/' "$ENV_FILE" | sort

      - name: Summary
        if: always()
        run: |
          set +e
          {
            echo "## Read-only statistics role (#152)"
            echo ""
            echo "- Role: \`$ROLE\`"
            echo "- Password: generated on the machine, stored as \`READONLY_DB_PASSWORD\` in \`$ENV_FILE\`, never printed"
            echo "- Scope: \`SELECT\` on all tables in \`public\`, except \`User\`, \`Session\`, \`PasswordReset\`; no write, no DDL, connection limit 20"
            echo "- Re-dispatch this job to rotate the password"
            echo ""
            echo "Consumers: scientific staff running statistics in R. The future in-app data-access page (#152) reads \`READONLY_DB_PASSWORD\` from the env file and shows it to logged-in users."
          } >> "$GITHUB_STEP_SUMMARY"

  # Query observability for index forensics (#169). Writes ALTER SYSTEM
  # settings (they land in postgresql.auto.conf inside the data volume),
  # creates pg_stat_statements and restarts the database container once,
  # because shared_preload_libraries and logging_collector are postmaster
  # settings. This is the only job that deliberately interrupts the database:
  # Prisma reconnects, requests in flight fail.
  db-observability:
    name: Apply query observability (#169)
    if: inputs.job == 'db-observability' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, boku]

    steps:
      - uses: actions/checkout@v4

      - name: Require the typed confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "ADOPT-PRODUCTION" ]; then
            echo "::error::refused: re-dispatch with confirm=ADOPT-PRODUCTION"
            exit 1
          fi
          echo "Confirmation accepted."

      - name: Preconditions
        run: |
          set -euo pipefail
          docker inspect "$PG_CONTAINER" >/dev/null || { echo "::error::$PG_CONTAINER not found"; exit 1; }
          if [ "$(docker inspect -f '{{.State.Running}}' "$PG_CONTAINER")" != "true" ]; then
            echo "::error::$PG_CONTAINER is not running"
            exit 1
          fi
          echo "Database container is running."

      - name: Settings before
        run: |
          set -euo pipefail
          docker exec "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -c "
            SELECT name, setting, pending_restart
            FROM pg_settings
            WHERE name IN ('shared_preload_libraries', 'logging_collector',
                           'log_min_duration_statement', 'pg_stat_statements.track',
                           'auto_explain.log_min_duration')
            ORDER BY name;"

      - name: Apply (first pass - writes postgresql.auto.conf)
        run: |
          set -euo pipefail
          docker exec -i "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" \
            -v ON_ERROR_STOP=1 < deploy/postgres/observability.sql

      - name: Prepare the log directory and back up postgresql.auto.conf
        run: |
          set -euo pipefail
          # logging_collector writes into <PGDATA>/log; create it as the
          # postgres user before the restart so a permission problem cannot
          # keep the server from starting.
          docker exec "$PG_CONTAINER" sh -c 'mkdir -p "$PGDATA/log" && chown postgres:postgres "$PGDATA/log"'
          BACKUP="$RUNNER_TEMP/postgresql.auto.conf.pre-observability"
          docker cp "$PG_CONTAINER:/var/lib/postgresql/data/postgresql.auto.conf" "$BACKUP"
          echo "BACKUP=$BACKUP" >> "$GITHUB_ENV"

      - name: Restart the database container
        run: |
          set -euo pipefail
          echo "Restarting $PG_CONTAINER - the app loses its database connections for a few seconds."
          docker restart "$PG_CONTAINER" >/dev/null

          READY=0
          for attempt in $(seq 1 30); do
            if docker exec "$PG_CONTAINER" pg_isready -U "$PG_USER" -d "$PG_DB" -q 2>/dev/null; then
              READY=1
              echo "Database is accepting connections (attempt $attempt)."
              break
            fi
            sleep 2
          done

          if [ "$READY" != "1" ]; then
            # A bad shared_preload_libraries value is exactly the failure mode
            # that keeps the server from starting (e.g. one quoted string
            # instead of a list). Put the previous config back and start again,
            # so this job can never leave production without a database.
            echo "::error::database did not come up - restoring the previous postgresql.auto.conf"
            docker cp "$BACKUP" "$PG_CONTAINER:/var/lib/postgresql/data/postgresql.auto.conf"
            docker start "$PG_CONTAINER" >/dev/null 2>&1 || docker restart "$PG_CONTAINER" >/dev/null 2>&1 || true
            for attempt in $(seq 1 30); do
              if docker exec "$PG_CONTAINER" pg_isready -U "$PG_USER" -d "$PG_DB" -q 2>/dev/null; then
                echo "Recovered with the previous configuration (attempt $attempt)."
                break
              fi
              sleep 2
            done
            exit 1
          fi

          docker exec "$PG_CONTAINER" pg_isready -U "$PG_USER" -d "$PG_DB"

      - name: Apply (second pass - creates the extension)
        run: |
          set -euo pipefail
          docker exec -i "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" \
            -v ON_ERROR_STOP=1 < deploy/postgres/observability.sql

      - name: Verify
        run: |
          set -euo pipefail
          echo "=== loaded libraries / extension ==="
          docker exec "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -Atc \
            'SHOW shared_preload_libraries'
          docker exec "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -Atc \
            "SELECT 'pg_stat_statements ' || extversion FROM pg_extension WHERE extname = 'pg_stat_statements'"
          docker exec "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -Atc \
            "SELECT 'tracked shapes: ' || count(*) FROM pg_stat_statements"

          # The published read-only password must not be able to read the query
          # text of other roles (the extension grants SELECT to PUBLIC).
          if docker exec "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -v ON_ERROR_STOP=1 \
               -c 'SET ROLE clx_readonly; SELECT count(*) FROM pg_stat_statements;' >/dev/null 2>&1; then
            echo "::error::clx_readonly can read pg_stat_statements - the REVOKE did not take effect"
            exit 1
          fi
          echo "clx_readonly is denied on pg_stat_statements."

          echo "=== log directory (inside the data volume) ==="
          docker exec "$PG_CONTAINER" sh -c 'ls -lh "$PGDATA/log" | tail -n 5'

      - name: Health check the app
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            if curl -fsS -o /dev/null http://127.0.0.1:3001/; then
              echo "App is healthy after the database restart (attempt $attempt)."
              exit 0
            fi
            sleep 2
          done
          echo "::error::the app did not answer on 127.0.0.1:3001 after the database restart"
          exit 1

      - name: Summary
        if: always()
        run: |
          set +e
          {
            echo "## Query observability (#169)"
            echo ""
            echo "- Settings: \`deploy/postgres/observability.sql\` (idempotent, \`ALTER SYSTEM\` inside the data volume)"
            echo "- Collected: \`pg_stat_statements\` (normalised), \`auto_explain\` above 500 ms, slow-query log above 2 s without bind parameters"
            echo "- Logs: \`\$PGDATA/log\` inside the volume, one file per weekday, at most 128 MB each"
            echo "- Next: dispatch \`job=db-report\` to read the statistics"
            echo ""
            echo "The database container was restarted once - postmaster settings cannot be applied otherwise."
          } >> "$GITHUB_STEP_SUMMARY"

  # Read-only counterpart of db-observability (#169): SELECTs from the
  # statistics views, writes no database row, needs no confirmation token.
  # The full report contains query texts, so it stays on the machine; only a
  # text-free summary is uploaded, because this repository is public.
  db-report:
    name: Index-forensics report (#169)
    if: inputs.job == 'db-report'
    runs-on: [self-hosted, boku]

    steps:
      - uses: actions/checkout@v4

      - name: Preconditions
        run: |
          set -euo pipefail
          docker inspect "$PG_CONTAINER" >/dev/null || { echo "::error::$PG_CONTAINER not found"; exit 1; }
          if [ "$(docker inspect -f '{{.State.Running}}' "$PG_CONTAINER")" != "true" ]; then
            echo "::error::$PG_CONTAINER is not running"
            exit 1
          fi
          if [ "$(docker exec "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -Atc \
                  "SELECT count(*) FROM pg_extension WHERE extname = 'pg_stat_statements'")" != "1" ]; then
            echo "::error::pg_stat_statements is not installed - dispatch job=db-observability first"
            exit 1
          fi
          echo "Database is running and pg_stat_statements is installed."

      - name: Run the full report (stays on the machine)
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          OUT_DIR="$HOME/catchlogx-reports"
          mkdir -p "$OUT_DIR"
          OUT="$OUT_DIR/observability-$STAMP.txt"
          docker exec -i "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" \
            -v ON_ERROR_STOP=1 < deploy/postgres/report.sql > "$OUT" 2>&1
          chmod 600 "$OUT"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          echo "SUMMARY=$OUT_DIR/summary-$STAMP.txt" >> "$GITHUB_ENV"
          echo "Full report: $OUT (query texts stay on this machine)."

      - name: Sanitised summary (no query text)
        run: |
          set -euo pipefail
          {
            echo "=== MEASUREMENT WINDOW ==="
            docker exec "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -c "
              SELECT current_database() AS database,
                     now() - COALESCE(d.stats_reset, pg_postmaster_start_time()) AS window,
                     (SELECT count(*) FROM pg_stat_statements) AS tracked_shapes
              FROM pg_stat_database d WHERE d.datname = current_database();"

            echo "=== TOP STATEMENTS BY TOTAL TIME (no query text) ==="
            docker exec "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -c "
              SELECT r.rolname AS role, s.calls,
                     round(s.total_exec_time::numeric, 1) AS total_ms,
                     round(s.mean_exec_time::numeric, 1) AS mean_ms,
                     s.shared_blks_read AS blk_read,
                     s.temp_blks_written AS temp_blk_written
              FROM pg_stat_statements s JOIN pg_roles r ON r.oid = s.userid
              WHERE s.toplevel
              ORDER BY s.total_exec_time DESC LIMIT 10;"

            echo "=== READ-ONLY ROLE CLX_READONLY (no query text) ==="
            docker exec "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -c "
              SELECT s.calls,
                     round(s.total_exec_time::numeric, 1) AS total_ms,
                     round(s.mean_exec_time::numeric, 1) AS mean_ms,
                     s.shared_blks_read AS blk_read
              FROM pg_stat_statements s JOIN pg_roles r ON r.oid = s.userid
              WHERE r.rolname = 'clx_readonly'
              ORDER BY s.total_exec_time DESC LIMIT 10;"

            echo "=== SEQUENTIAL SCANS ==="
            docker exec "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -c "
              SELECT relname, seq_scan, seq_tup_read, idx_scan, n_live_tup,
                     pg_size_pretty(pg_total_relation_size(relid)) AS total_size
              FROM pg_stat_user_tables
              WHERE seq_scan > 0
              ORDER BY seq_tup_read DESC LIMIT 15;"

            echo "=== UNUSED INDEXES ==="
            docker exec "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -c "
              SELECT s.relname AS table_name, s.indexrelname AS index_name,
                     pg_size_pretty(pg_relation_size(s.indexrelid)) AS index_size
              FROM pg_stat_user_indexes s
              JOIN pg_index i ON i.indexrelid = s.indexrelid
              WHERE s.idx_scan = 0 AND NOT i.indisprimary
              ORDER BY pg_relation_size(s.indexrelid) DESC LIMIT 15;"
          } > "$SUMMARY"
          cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the sanitised summary
        if: always() && env.SUMMARY != ''
        uses: actions/upload-artifact@v4
        with:
          name: prod-db-report-${{ github.run_id }}
          path: ${{ env.SUMMARY }}
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          set +e
          {
            echo "## Index-forensics report (#169)"
            echo ""
            echo "- Full report (with query texts): \`$HOME/catchlogx-reports/observability-${STAMP:-<stamp>}.txt\` **on the production machine**"
            echo "- Uploaded artifact: text-free summary only (this repository is public)"
            echo "- Logs with plans: \`docker exec $PG_CONTAINER sh -c 'tail -n 200 \$PGDATA/log/postgresql-\$(date +%a).log'\`"
            echo "- Clean measurement window: \`SELECT pg_stat_statements_reset(); SELECT pg_stat_reset();\` (superuser, discards history)"
          } >> "$GITHUB_STEP_SUMMARY"
