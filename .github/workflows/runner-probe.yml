name: Runner Probe

# TEMPORARY (#136): verifies that the `boku` label routes jobs to the BOKU
# production machine (catchlogx-server) and that that runner still executes jobs
# after the repository changed owner. Delete once confirmed.
on:
  push:
    branches: [dev]

jobs:
  probe:
    runs-on: [self-hosted, boku]
    steps:
      - name: Report which machine picked up this job
        run: |
          echo "hostname: $(hostname)"
          echo "whoami:   $(whoami)"
          uname -a
          echo "labels:   self-hosted, boku"
