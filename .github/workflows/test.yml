name: Test

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  # Lets the deploy job be triggered by hand (useful for runner smoke tests).
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

  # Enforces the migration-only workflow (#129): the migration history must
  # reproduce schema.prisma exactly. Red when someone changes the schema with
  # `prisma db push` and leaves the history behind.
  migration-drift:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clxadmin
          POSTGRES_PASSWORD: clxadmin
          POSTGRES_DB: clx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clxadmin -d clx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://clxadmin:clxadmin@localhost:5432/clx?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migration history to an empty database
        run: npx prisma migrate deploy

      - name: Fail if the migration history drifts from schema.prisma
        run: >-
          npx prisma migrate diff
          --from-url "$DATABASE_URL"
          --to-schema-datamodel prisma/schema.prisma
          --exit-code

  # Deploys the dev instance (catchlogx.graf.priv.at) from the self-hosted VPS
  # runner: build once per commit, publish an immutable release keyed by SHA,
  # restart the service. The running process never builds (#135).
  #
  # Only runs on push to dev (and manual dispatch), never on pull_request - a
  # self-hosted runner must not execute untrusted PR code.
  deploy:
    needs: [test, migration-drift]
    if: >-
      github.ref == 'refs/heads/dev' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, vps]

    concurrency:
      group: deploy-vps
      cancel-in-progress: false

    env:
      # The deploy job builds in the runner's checkout, which has no .env
      # (gitignored); the instance's real env file is the source of truth.
      APP_ENV_FILE: /home/catchlogx/repos/georgernstgraf/CatchLogX/.env

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Provide runtime environment
        run: cp "$APP_ENV_FILE" .env

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build (standalone)
        run: npm run build

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Publish release
        run: ./scripts/publish-release.sh "$GITHUB_SHA"

      - name: Restart service
        run: systemctl --user restart catchlogx.service

      - name: Health check
        run: |
          for attempt in $(seq 1 15); do
            if curl -fsS -o /dev/null http://127.0.0.1:40873/upload; then
              echo "Service is healthy."
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed - the new release is live but not responding." >&2
          exit 1
