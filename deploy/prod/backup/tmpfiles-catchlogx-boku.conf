# /etc/tmpfiles.d/catchlogx-boku.conf  -  install as 0644 root:root
#
# Mountpoint for the institute file server (#86). It lives in /run on purpose:
# a reboot always starts unmounted, and the backup mounts the share only for
# the duration of the off-site sync. `clxadmin` owns the directory so the
# mounted files (uid=clxadmin via the mount options) are writable for the
# backup user.
d /run/catchlogx-boku 0750 clxadmin clxadmin -
