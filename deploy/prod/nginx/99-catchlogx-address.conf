# #164: nginx binds the fixed public address 141.244.222.191:3001 (the old-URL
# redirect). That address has to exist before nginx starts, otherwise the bind
# fails and nginx exits - so wait for the network and retry on failure.
[Unit]
After=network-online.target
Wants=network-online.target

[Service]
Restart=on-failure
RestartSec=5s
