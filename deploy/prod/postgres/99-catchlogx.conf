# PostgreSQL settings for the CatchLogX production cluster (#170).
#
# Versioned copy of /etc/postgresql/16/main/conf.d/99-catchlogx.conf.
# `conf.d` is included at the END of the packaged postgresql.conf, so everything
# here wins over the Debian defaults. Keep this file the single source of truth:
# do NOT additionally write the same knobs with ALTER SYSTEM, or a stale
# postgresql.auto.conf will shadow this file after the next change (that is how
# the 2026-10-29 dev incident happened).
#
# Apply: see README.md. Reload for everything except the postmaster settings
# (listen_addresses, shared_preload_libraries, logging_collector, ssl).
#
# NOTE on quoting: inside a configuration FILE the list is written as one
# quoted string - that is correct here. (The `ALTER SYSTEM SET … = 'a,b'` form
# is the trap: it stores one library name. Never copy this line into ALTER
# SYSTEM.)

# --- reachability ----------------------------------------------------------
# BOKU-wide open by decision (2026-10-27): no firewall, the boundary is the
# role. The app itself connects over loopback.
listen_addresses = '*'
port = 5432

# --- audit trail and rate brake (#122) -------------------------------------
log_connections = on
log_line_prefix = '%m [%p] %q%u@%d %a %r '

# auth_delay slows down failed password attempts; the two observability
# libraries are #169. All three must be preloaded, so this is a postmaster
# setting: changing the list needs a restart, not a reload.
shared_preload_libraries = 'auth_delay, auto_explain, pg_stat_statements'
auth_delay.milliseconds = 1000

# --- TLS (#170) ------------------------------------------------------------
# Self-signed: the BOKUnet has no CA for this host. TLS is OFFERED, not
# enforced, so nothing that works today breaks. libpq's default sslmode=prefer
# encrypts automatically (R, psql); clients that want to enforce it say
# sslmode=require. sslmode=disable still works - a deliberate trade for
# frictionless access (docs/ai/DECISIONS.md, 2026-10-30).
ssl = on
ssl_cert_file = '/etc/postgresql/16/main/server.crt'
ssl_key_file  = '/etc/postgresql/16/main/server.key'
ssl_min_protocol_version = 'TLSv1.2'

# --- query observability / index forensics (#169) --------------------------
# Real I/O timing, otherwise blk_read_time stays 0 and an index that only
# saves cache hits looks harmless.
track_io_timing = on

# Slow-query evidence: plans with buffers at 500 ms (auto_explain), a plain
# 2 s net, both WITHOUT bind parameters - the SQL page and the R clients send
# research values, not just placeholders.
log_min_duration_statement = '2s'
log_statement = 'none'
log_lock_waits = on
log_temp_files = '10MB'
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0

# Logs stay on the machine, bounded: one file per weekday, truncated on
# rotation. `log` is relative to PGDATA.
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%a.log'
log_rotation_age = '1d'
log_rotation_size = '128MB'
log_truncate_on_rotation = on
log_checkpoints = on

# Extension GUCs. A config file may set them before the library is loaded
# (PostgreSQL keeps placeholders); only ALTER SYSTEM on a RUNNING server fails
# with "unrecognized configuration parameter".
pg_stat_statements.track = 'all'
pg_stat_statements.track_utility = on
auto_explain.log_min_duration = '500ms'
auto_explain.log_analyze = on
auto_explain.log_buffers = on
auto_explain.log_timing = on
auto_explain.log_wal = off
auto_explain.log_verbose = off
auto_explain.log_settings = off
