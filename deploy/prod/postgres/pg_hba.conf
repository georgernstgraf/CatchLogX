# PostgreSQL access rules for the CatchLogX production cluster (#170).
#
# Versioned copy of /etc/postgresql/16/main/pg_hba.conf.
# Changes take effect with `systemctl reload postgresql@16-main` (or a restart).
#
# Three paths exist on this host, deliberately:
#
#   1. local socket + peer, OS user clxadmin -> DB role clxadmin.
#      Used by the backup timer and by every maintenance command run from the
#      host (pg_dump, psql, pg_restore). No password is stored for this path;
#      the role is a superuser anyway and its password lives in
#      /opt/CatchLogX/.env, so peer auth grants no extra capability.
#   2. local socket + peer for postgres -> postgres. Break-glass only.
#   3. TCP + scram-sha-256 for everyone else: the app over loopback and the
#      research group over the BOKUnet (TLS is offered, see
#      conf.d/99-catchlogx.conf - clients choose sslmode=prefer/require).
#
# There is no `hostssl`-only rule: the BOKUnet has no CA for this host, and
# enforcing TLS would break existing R clients for no confidentiality gain the
# SCRAM handshake does not already provide (2026-10-27 decision, reaffirmed
# 2026-10-30).

# TYPE   DATABASE   USER        ADDRESS         METHOD
local    all        postgres                    peer
local    all        clxadmin                    peer
local    all        all                         scram-sha-256

host     all        all         127.0.0.1/32    scram-sha-256
host     all        all         ::1/128         scram-sha-256

# The BOKU-wide open port: the app never comes from here (it is loopback), this
# is the research group's path plus any operator tooling.
host     all        all         0.0.0.0/0       scram-sha-256
host     all        all         ::/0            scram-sha-256
