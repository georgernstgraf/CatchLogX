# SSH is keys-only on the production host since 2026-10-29 (#122, #115).
# Target on the host:
#
#   /etc/ssh/sshd_config.d/99-catchlogx-no-password.conf   (644 root:root)
#
# Apply with `sshd -t && systemctl reload ssh` - a reload, never a restart, and
# only with a second key-based session already open.
#
# What this does NOT change: `root` keeps password login **on the console**
# (getty@tty1 -> /bin/login -> PAM). That is the deliberate break-glass path;
# `PermitRootLogin prohibit-password` restricts sshd only. Do not add
# `PermitRootLogin no`, `AllowUsers`/`DenyUsers` for root or `pam_securetty`,
# and do not run `passwd -l root` - a locked root without console access is an
# unrecoverable machine.
#
# `clxadmin`'s password is locked (`passwd -l clxadmin`) but its **key** login
# still works: pam_unix in the *account* phase checks expiry, not the `!` lock.
PasswordAuthentication no
KbdInteractiveAuthentication no
