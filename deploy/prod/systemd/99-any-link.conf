# 2026-10-27 (#122): the vendor/netplan wait blocked the whole boot for
# 2min05s because eno1 (then DHCP) only became "online" after the 120 s cap.
# Since the IP is static now, eno1 is online within ~2 s. Scope the wait to
# the real NIC and cap it hard: a timeout only costs 15 s of ordering, the
# boot continues either way. Deliberately NOT "--any" without "-i": docker0
# and the bridge would count as "online" and defeat the ordering entirely.
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online -i eno1 --timeout=15
