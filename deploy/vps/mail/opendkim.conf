# /etc/opendkim.conf on claw — effective settings (comments stripped), 2026-11-10 (#193).
# Installed from the Ubuntu package; the last block is what this setup adds.
Syslog			yes
SyslogSuccess		yes
Canonicalization	relaxed/simple
OversignHeaders		From
UserID			opendkim
UMask			007
Socket			inet:8891@127.0.0.1
PidFile			/run/opendkim/opendkim.pid
TrustAnchorFile		/usr/share/dns/root.key

# claw: / is root:georg 775 and /etc is georg:georg 775, so OpenDKIM's
# "safe key" walk (every directory from / down) can never pass. The key itself
# is 0600 opendkim:opendkim; the warning stays in the log by design.
RequireSafeKeys		no

# Send-only domain: sign, never verify.
Mode			s
Domain			catchlogx.graf.priv.at
Selector		clx
KeyTable		/etc/dkimkeys/keytable
SigningTable		refile:/etc/dkimkeys/signingtable
