# Connection capacity for the CatchLogX DEV instance (#171).
#
# Versioned copy of /etc/postgresql/16/main/conf.d/99-catchlogx-capacity.conf
# on claw.graf.priv.at (catchlogx.graf.priv.at). `conf.d` is included at the END
# of the packaged postgresql.conf, so everything here wins over the Debian
# defaults. Keep this the single source of truth and do NOT write the same knobs
# with ALTER SYSTEM - a stale postgresql.auto.conf shadowing this file is how the
# 2026-10-29 dev incident happened (`docs/ai/PITFALLS.md`).
#
# Apply:
#   install -m 644 deploy/vps/postgres/99-catchlogx-capacity.conf \
#           /etc/postgresql/16/main/conf.d/99-catchlogx-capacity.conf
#   systemctl restart postgresql@16-main        # max_connections is a POSTMASTER setting
#   sudo -u postgres psql -d clx -c \
#     'ALTER ROLE clx_readonly CONNECTION LIMIT 108'    # no restart needed
#
# Same numbers as production (deploy/prod/postgres/99-catchlogx.conf) so dev
# behaves like prod: 108 read-only slots, the app's Prisma pool and maintenance
# commands all fit. The VPS has only ~3.8 GB RAM (~2.1 GB available), so the
# binding constraint is `work_mem` in a parallel burst, not the slot count:
# 108 x 8 MB is the documented worst case, real usage is a handful of sessions.
#
# A clean restart keeps pg_stat_statements (`save = on`, #171 verified).
max_connections = 200
superuser_reserved_connections = 5
work_mem = '8MB'
