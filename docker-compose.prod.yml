# Production compose override (#143) - layer it on the base file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Since the immutable-release topology (#143) the production APP is a systemd
# user unit (`catchlogx.service` -> `node ~/current/server.js`), NOT a
# container. This override therefore DISABLES the base `app` service on
# production: it puts it behind the compose profile `interim-container`, which
# nothing activates, so `up -d` starts only the database. That is a structural
# guard, not a convention - an accidental `docker compose up -d` on the machine
# can no longer resurrect the app container and race the systemd unit for port
# 3001.
#
# The base `app` command (which contains `prisma db push`) is overridden anyway,
# so even an explicit `--profile interim-container up` could never run the
# db-push-era code against the adopted, migration-tracked schema.
#
# Nothing here may ever run `prisma db push`.
services:
  app:
    profiles: ["interim-container"]
    command: npx next start -p 3001
