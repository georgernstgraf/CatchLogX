services:
  db:
    image: postgres:16-alpine
    container_name: clx-postgres
    environment:
      POSTGRES_USER: clxadmin
      POSTGRES_PASSWORD: clxadmin
      POSTGRES_DB: clx
    ports:
      - "5432:5432"
    volumes:
      - clx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clxadmin -d clx"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: clx-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - clx_miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: clx-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      set -e;
      mc alias set clx http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing clx/catchlogx-files;
      printf '' | mc pipe clx/catchlogx-files/CatchLogX/uploads/.keep;
      printf '' | mc pipe clx/catchlogx-files/CatchLogX/dummy_files/.keep;
      "

  app:
    image: node:20-alpine
    container_name: clx-web
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://clxadmin:clxadmin@db:5432/clx?schema=public
      NEXTAUTH_URL: https://catchlogx.test.a19.at
      NEXTAUTH_SECRET: "your-secure-secret-change-in-production"
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      HOSTNAME: "0.0.0.0"
      PORT: "3001"
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: catchlogx-files
      MINIO_ROOT_PREFIX: CatchLogX
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: >
      sh -c "npm ci --include=dev || npm install --include=dev
      && npx prisma generate
      && npx prisma db push
      && npx tsx scripts/create-user.ts
      && npx tsx scripts/insert-fish.ts
      && npx tsx scripts/insert-river-sites.ts
      && npx tsx scripts/insert-samplings.ts
      && npx tsx scripts/insert-fish-catches.ts
      && npm run build
      && npx next start -p 3001
      "
    restart: unless-stopped

volumes:
  clx_pgdata:
  clx_miniodata:
